                    rampa: true
                    ascensore: false
                    bagnoAccessibile: true
                    ingressoSenzaGradini: true
                    parcheggioRiservato: false
                  accessibile: true
                  createdAt: '2026-05-15T10:00:00.000Z'
                  updatedAt: '2026-05-16T09:00:00.000Z'
        '400':
          description: id non è un ObjectId valido (24 hex).
