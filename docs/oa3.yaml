openapi: 3.0.3

info:
  title: UrbanAccess API
  description: |
    REST API per il sistema **UrbanAccess**, una piattaforma di mappatura crowdsourcing
    dell'accessibilità urbana.

    ## Convenzioni
    - Tutte le risposte sono in formato JSON.
    - Architettura RESTful e stateless.
    - Password encryption via bcrypt.
    - Autenticazione tramite JWT.

    ## Modello utenti
    Il sistema distingue tre ruoli principali: `cittadino`, `proprietario` e `operatore`.

    ## Architettura registrazione
    La registrazione è segmentata per ruolo tramite endpoint dedicati:
    - `POST /auth/register/citizen` — registrazione cittadini
    - `POST /auth/register/owner` — registrazione proprietari
    - **Operatori comunali**: NON registrabili via API pubblica.
      Creati esclusivamente tramite seed script o shell Mongoose dall'amministratore.

    Il payload di registrazione è **minimale** per i cittadini (solo identità).
    I proprietari aggiungono `partitaIVA` poiché sono dati legalmente
    necessari per identificare un'attività commerciale.

    ## Gestione del profilo utente
    Dopo la registrazione, il profilo dell'utente può essere modificato parzialmente tramite `PATCH /users/me`.
    L'endopoint segue il pattern PATCH parziale: il body contiene solo i campi da modificare. I campi modificabili sono
    gestiti server-side tramite una whitelist con vincoli per ogni campo (ruolo, validazione, trasformazione).

    Attualmente i campi modificabili sono `nome` e `cognome` (per tutti i ruoli) e `profiloDisabilita` (riservato ai cittadini).

    ## Asset statici (foto segnalazioni)
    Le foto caricate dai cittadini in `POST /publicReports` e `POST /privateReports` vengono
    salvate su disco e servite come asset statici da `GET /uploads/reports/{filename}`.
    Tali URL **NON** sono parte dell'API REST documentata: sono risorse pubbliche
    raggiungibili direttamente.

    ## Routing e geocoding
    Il sistema offre due funzionalità di supporto alla navigazione accessibile,
    raggruppate sotto il tag `Routing`:

    - `GET /geocode` — traduce un indirizzo testuale in coordinate geografiche,
      appoggiandosi al servizio **Nominatim** di OpenStreetMap. Restituisce una
      lista di candidati, lasciando al client la disambiguazione.
    - `GET /routes` — calcola un percorso pedonale verso una destinazione tramite
      il motore di routing **Valhalla** (self-hosted, costing `pedestrian`),
      restituendo la geometria come GeoJSON LineString.

    Entrambi gli endpoint sono di **sola lettura, idempotenti e stateless**:
    nessun percorso o ricerca viene persistito. Un percorso è infatti un dato
    derivato e deperibile, funzione dello stato corrente della rete di
    accessibilità; viene quindi sempre ricalcolato e mai salvato.

    Nella fase attuale l'origine del percorso è **hardcoded al centro di Trento**
    e non rilevata dalla geolocalizzazione reale dell'utente.

    ### Semantica degli errori di routing
    Il sistema distingue due situazioni che un'integrazione ingenua confonderebbe:
    - **`422 Unprocessable Entity`** — la destinazione è valida ma non raggiungibile
      a piedi (punto isolato dalla rete, fuori area, oltre la distanza massima
      pedonale). Non è un guasto: semplicemente nessun percorso esiste.
    - **`502 Bad Gateway`** — il servizio esterno (Valhalla o Nominatim) è
      irraggiungibile o malfunzionante. Guasto reale del servizio a monte.

    Questa distinzione consente al client di reagire correttamente: suggerire
    un'altra destinazione nel primo caso, riprovare più tardi nel secondo.

  version: 1.0.0
  contact:
    name: Gruppo 17 - UrbanAccess - Andrea Boarini, Antonio Possemato, Giovanni Todesco
    email: decideremaildicontatto@gmail.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Server di sviluppo locale

tags:
  - name: Authentication
    description: Endpoint per registrazione e accesso degli utenti
  - name: Users
    description: Gestione del profilo utente autenticato
  - name: Segnalazioni
    description: |
      Gestione delle segnalazioni di barriere architettoniche e ostacoli.
      Le segnalazioni si dividono in **pubbliche** (suolo pubblico, immediatamente
      visibili) e **private** (strutture private, soggette a validazione crowdsourcing).
  - name: Strutture
    description: | 
      Gestione delle strutture private (attività commerciali) registrate
      dai proprietari. Le strutture sono il "target" delle segnalazioni private.
  - name: Routing
    description: |
      Calcolo di percorsi pedonali accessibili e geocoding di indirizzi.
      Il geocoding traduce testo libero in coordinate (Nominatim/OpenStreetMap);
      il routing calcola il tragitto a piedi tramite motore Valhalla self-hosted.
      Entrambi sono operazioni di sola lettura e stateless: nessun dato viene
      persistito a seguito di queste chiamate.

paths:

  /auth/register/citizen:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo cittadino
      description: |
        Crea un nuovo account di tipo `cittadino` nel sistema.

        **Payload minimale**: solo dati anagrafici e credenziali.
        I dati di profilazione (profilo disabilità, ecc.) sono gestiti
        tramite endpoint dedicati post-registrazione.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - Lo `scoreAffidabilita` viene inizializzato a `5` (score neutrale per evitare penalizzazione iniziale).
        - `profiloDisabilita` ha default `[]` ovvero un array vuoto.
        - `storicoPercorsi` e `storicoSegnalazioni` inizializzati come array vuoti.
      operationId: registraCittadino
      requestBody:
        required: true
        description: Dati anagrafici e credenziali del nuovo cittadino.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
              nome: Mario
              cognome: Rossi
      responses:
        '201':
          description: Cittadino registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_citizen
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: []
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/register/owner:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo proprietario di struttura
      description: |
        Crea un nuovo account di tipo `proprietario` nel sistema.

        **Differenze rispetto al cittadino:**
        - Richiede `partitaIVA` (11 cifre, identificatore fiscale italiano).

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - `partitaIVA` deve essere univoca nel sistema.
        - `strutture` inizializzato come array vuoto.
      operationId: registraProprietario
      requestBody:
        required: true
        description: Dati anagrafici, credenziali e dati commerciali del proprietario.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              email: proprietario@example.com
              password: SecurePassword12345
              nome: Luigi
              cognome: Bianchi
              partitaIVA: '12345678901'
      responses:
        '201':
          description: Proprietario registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_owner
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c8
                  email: proprietario@example.com
                  nome: Luigi
                  cognome: Bianchi
                  ruolo: proprietario
                  partitaIVA: '12345678901'
                  createdAt: '2026-05-12T14:35:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: |
            Conflitto su campo univoco. Si verifica quando l'email o la
            partitaIVA sono già registrate nel sistema. Il campo in conflitto
            è specificato nel messaggio di errore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login utente
      description: |
        Autentica un utente esistente (cittadino o proprietario) tramite
        email e password, restituendo un **token JWT** da usare nelle richieste successive.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima della ricerca.
        - La password viene confrontata con l'hash bcrypt salvato in DB.
        - In caso di successo viene generato un token JWT firmato con `JWT_SECRET`,
          contenente `userId`, `ruolo` e scadenza a **2 ore**.
        - Il token deve essere incluso nell'header `Authorization: Bearer <token>`
          per accedere agli endpoint protetti.

        **Sicurezza:**
        - In caso di email non trovata o password errata viene restituito sempre
          `401 Unauthorized` con messaggio generico, senza specificare quale
          dei due campi è errato (prevenzione user enumeration).
      operationId: loginUtente
      requestBody:
        required: true
        description: Credenziali di accesso.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
      responses:
        '200':
          description: Login effettuato con successo. Restituisce il token JWT e i dati pubblici dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login effettuato con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2NWEzZjRlN2I4ZDljMWY0YTJlNWI2YzciLCJydW9sbyI6ImNpdHRhZGlubyIsImlhdCI6MTc0NzA1NjIwMCwiZXhwIjoxNzQ3MTQyNjAwfQ.example
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: []
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Credenziali non valide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Credenziali non valide
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /users/me:
    get:
      tags:
        - Users
      summary: Recupera il profilo dell'utente autenticato
      description: |
        Restituisce la rappresentazione completa del profilo dell'utente identificato dal JWT.

        **Comportamento server-side:**
        - L'`userId` viene estratto dal JWT.
        - La query viene eseguita sul modello base `User`: il documento ritornato include
          automaticamente i campi del subschema corrispondente al ruolo (`cittadino`,
          `proprietario`, `operatore`) grazie al meccanismo dei discriminator di Mongoose.
        - I campi sensibili (`password`) o interni (`__v`, `notifiche`) sono esclusi dalla risposta.

        **Verifica sul token:**
        - Token mancante, malformato o scaduto produce Errore 401.
        - Token valido ma utente inesistente (es. eliminato) produce Errore 404.
      operationId: getProfiloUtente
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profilo recuperato con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfileResponse'
              examples:
                cittadino:
                  summary: Profilo di un cittadino
                  value:
                    user:
                      _id: 65a3f4e7b8d9c1f4a2e5b6c7
                      email: mario.rossi@example.com
                      nome: Mario
                      cognome: Rossi
                      ruolo: cittadino
                      profiloDisabilita: [sediaARotelle]
                      scoreAffidabilita: 5
                      createdAt: '2026-05-12T14:30:00.000Z'
                proprietario:
                  summary: Profilo di un proprietario
                  value:
                    user:
                      _id: 65a3f4e7b8d9c1f4a2e5b6c8
                      email: proprietario@example.com
                      nome: Luigi
                      cognome: Bianchi
                      ruolo: proprietario
                      partitaIVA: '12345678901'
                      createdAt: '2026-05-12T14:35:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Utente non trovato. Il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Users
      summary: Aggiorna il profilo dell'utente autenticato
      description: |
        Aggiorna parzialmente il profilo dell'utente identificato dal JWT.

        **Semantica PATCH:**
        Il payload descrive i campi da modificare. Ciò che non è specificato nel body resta invariato.
        Se viene specificato un campo, il suo valore sovrascrive completamente quello esistente.

        **Campi modificabili da whitelist:**
        - `nome`, `cognome`: Modificabili da tutti i ruoli (`cittadino`, `proprietario`, `operatore`).
        - `profiloDisabilita`: Riservato esclusivamente al ruolo `cittadino`. I valori accettati sono: `sediaARotelle`, `cecita`, `sordita`, `ausilioDeambulazione`.

        **Comportamento server-side:**
        - L'`userId` viene estratto dal JWT.
        - I valori duplicati nell'array `profiloDisabilita` vengono deduplicati lato server.
        - Valori non ammessi nell'enum producono Errore 400.
        - Campi non presenti nella whitelist dei modificabili vengono ignorati.
        - Body vuoto (nessun campo modificabile presente) produce Errore 400.

        **Verifica sul token:**
        - Se il token non è valido o scaduto produce Errore 401.
        - Se il token è valido ma l'utente non esiste più (es. eliminato) produce Errore 404.
        - Se il token passato appartiene a un utente con un ruolo diverso da `cittadino` e si tenta di modificare `profiloDisabilita`, produce Errore 403 segnalando l'impossibilità di modificare i campi non esistenti come attributi per quel ruolo. Questo garantisce che solo chi possiede un dato attributo possa modificarlo.
      operationId: aggiornaProfiloUtente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nome: Mario Pasquale
              cognome: Rossi
              profiloDisabilita: [sediaARotelle, cecita]
      responses:
        '200':
          description: Profilo aggiornato con successo. Ritorna la rappresentazione completa dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message: Profilo aggiornato con successo
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario Pasquale
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: [sediaARotelle, cecita]
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Autenticazione fallita. Possibili cause:
            - token mancante nell'header `Authorization`
            - token non valido (firma errata, formato errato, ecc.)
            - token scaduto (oltre 2 ore dalla generazione)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenMancante:
                  value:
                    error: Token mancante
                tokenScaduto:
                  value:
                    error: Token scaduto
                tokenNonValido:
                  value:
                    error: Token non valido
        '403':
          description: |
            Ruolo autenticato ma non autorizzato.
            Si verifica quando si tenta di modificare un campo riservato a un ruolo diverso dal proprio
            (es. un `proprietario` che tenta di modificare `profiloDisabilita` riservato ai `cittadino`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Modifica del campo "profiloDisabilita" non permessa per il ruolo "proprietario"
        '404':
          description: Utente non trovato. Si verifica quando il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server
  /publicReports:
    post:
      summary: Crea una nuova segnalazione pubblica
      description: |
        Crea una segnalazione su suolo pubblico. Solo i cittadini autenticati possono effettuare questa operazione.
        Il body è `multipart/form-data` per permettere l'upload di foto allegate.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [descrizione, categoria, longitudine, latitudine]
              properties:
                descrizione:
                  type: string
                  minLength: 10
                  maxLength: 1000
                categoria:
                  type: string
                  enum:
                    - marciapiede_rotto
                    - ostacolo_temporaneo
                    - auto_sosta_vietata
                    - scalino_non_segnalato
                    - pavimentazione_dissestata
                    - semaforo_non_accessibile
                    - mancanza_rampa
                    - altro
                longitudine:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                latitudine:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                foto:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Segnalazione creata
          headers:
            Location:
              description: URI della risorsa creata
              schema:
                type: string
                example: /api/v1/publicReports/65b1a2c3d4e5f6a7b8c9d0e1
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  segnalazione:
                    $ref: '#/components/schemas/SegnalazionePubblica'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ruolo non autorizzato (solo cittadini)

    get:
      summary: Recupera segnalazioni pubbliche con filtri opzionali
      description: |
        Restituisce l'elenco delle segnalazioni pubbliche. Tutti i parametri di query sono opzionali e combinabili.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      parameters:
        - name: bbox
          in: query
          required: false
          description: 'Bounding box geografica, formato: minLng,minLat,maxLng,maxLat'
          schema:
            type: string
          example: "11.10,46.05,11.15,46.10"
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [APERTA, IN_VERIFICA, PRESA_IN_CARICO, RISOLTA, ARCHIVIATA]
        - name: categoria
          in: query
          required: false
          schema:
            type: string
            enum:
              - marciapiede_rotto
              - ostacolo_temporaneo
              - auto_sosta_vietata
              - scalino_non_segnalato
              - pavimentazione_dissestata
              - semaforo_non_accessibile
              - mancanza_rampa
              - altro
      responses:
        '200':
          description: Lista segnalazioni pubbliche filtrate
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  segnalazioni:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegnalazionePubblica'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /privateReports:
    post:
      summary: Crea una nuova segnalazione privata su una struttura
      description: |
        Crea una segnalazione relativa a una struttura privata. Solo i cittadini autenticati possono effettuare questa operazione.
        La segnalazione nasce in stato IN_VERIFICA e diventa visibile solo quando lo score di validazione comunitario raggiunge la soglia.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [descrizione, categoria, longitudine, latitudine, strutturaAssociata]
              properties:
                descrizione:
                  type: string
                  minLength: 10
                  maxLength: 1000
                categoria:
                  type: string
                  enum:
                    - mancanza_rampa
                    - bagno_non_accessibile
                    - ascensore_guasto
                    - spazi_interni_stretti
                    - altro
                longitudine:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                latitudine:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                strutturaAssociata:
                  type: string
                  pattern: '^[a-f0-9]{24}$'
                  description: ObjectId MongoDB della struttura privata
                foto:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Segnalazione creata e in attesa di validazione
          headers:
            Location:
              description: URI della risorsa creata
              schema:
                type: string
                example: /api/v1/privateReports/65b1a2c3d4e5f6a7b8c9d0e1
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  segnalazione:
                    $ref: '#/components/schemas/SegnalazionePrivata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ruolo non autorizzato (solo cittadini)
        '404':
          description: Struttura associata non trovata

    get:
      summary: Recupera segnalazioni private con filtri opzionali
      description: |
        Restituisce l'elenco delle segnalazioni private. Per i ruoli non-operatore vengono restituite solo le segnalazioni già validate dalla community (visibile=true).
        Gli operatori vedono anche quelle in stato IN_VERIFICA per finalità di moderazione.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      parameters:
        - name: bbox
          in: query
          required: false
          description: 'Bounding box geografica, formato: minLng,minLat,maxLng,maxLat'
          schema:
            type: string
          example: "11.10,46.05,11.15,46.10"
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [APERTA, IN_VERIFICA, PRESA_IN_CARICO, RISOLTA, ARCHIVIATA]
        - name: categoria
          in: query
          required: false
          schema:
            type: string
            enum:
              - mancanza_rampa
              - bagno_non_accessibile
              - ascensore_guasto
              - spazi_interni_stretti
              - altro
      responses:
        '200':
          description: Lista segnalazioni private filtrate
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  segnalazioni:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegnalazionePrivata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /structures:
    post:
      tags:
        - Strutture
      summary: Registra una nuova struttura privata
      description: |
        Permette a un `proprietario` autenticato di registrare una nuova
        attività commerciale, rendendola visibile sulla mappa del sistema
        come potenziale target di segnalazioni private.
 
        ## Geolocalizzazione
        A differenza degli endpoint `/reports/*` (che usano `multipart/form-data`
        e quindi coordinate "piatte"), qui il payload è `application/json` e la
        geolocalizzazione viene inviata come oggetto **GeoJSON `Point`** completo:
        `{ type: "Point", coordinates: [lng, lat] }`. Indice `2dsphere` lato DB.
 
        **Ordine coordinate**: GeoJSON impone `[longitudine, latitudine]`,
        contro-intuitivo rispetto a Google Maps.
 
        ## Comportamento server-side
        - Il `proprietario` viene impostato dal JWT, non dal client (anti-IDOR).
        - L'`_id` della struttura viene aggiunto a `strutture` del proprietario.
      operationId: registraStruttura
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrutturaRequest'
            example:
              nome: Bar Centrale
              categoria: bar
              indirizzo: Via Belenzani 14, 38122 Trento TN
              geolocalizzazione:
                type: Point
                coordinates: [11.1217, 46.0667]
      responses:
        '201':
          description: Struttura registrata con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/structures/65b4f4e7b8d9c1f4a2e5b6a9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrutturaResponse'
              example:
                message: Struttura registrata con successo
                struttura:
                  _id: 65b4f4e7b8d9c1f4a2e5b6a9
                  nome: Bar Centrale
                  categoria: bar
                  indirizzo: Via Belenzani 14, 38122 Trento TN
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0667]
                  proprietario: 65a3f4e7b8d9c1f4a2e5b6c8
                  createdAt: '2026-05-15T10:00:00.000Z'
                  updatedAt: '2026-05-15T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token mancante, non valido o scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token mancante
        '403':
          description: Ruolo non autorizzato. Solo il ruolo `proprietario` può registrare strutture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Accesso negato: ruolo non autorizzato'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

    get:
      tags:
        - Strutture
      summary: Lista delle strutture con filtri opzionali
      description: |
        Restituisce l'elenco delle strutture, opzionalmente filtrate per
        bounding box geospaziale, categoria e/o proprietario.
 
        ## Vincoli di autorizzazione su `proprietario`
        Il filtro `proprietario=<id>` è ammesso **solo se l'id coincide con
        quello del JWT** (anti-IDOR/anti-enumeration). Tentativi di filtrare
        per id altrui restituiscono `403`.
 
        ## Visibilità del campo `proprietario` nella risposta
        Il campo `proprietario` viene incluso solo se il chiamante sta
        richiedendo le proprie strutture (`?proprietario=<suo_id>`).
        Altrimenti viene omesso per privacy.
      operationId: listaStrutture
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          required: false
          description: |
            Bounding box geospaziale nel formato `minLng,minLat,maxLng,maxLat`.
            Restituisce solo le strutture la cui geolocalizzazione cade nel rettangolo.
            Sfrutta l'indice 2dsphere.
          example: "11.10,46.05,11.15,46.08"
        - in: query
          name: categoria
          schema:
            type: string
            enum:
              - ristorante
              - bar
              - negozio
              - ufficio
              - hotel
              - studio_medico
              - palestra
              - altro
          required: false
          description: Filtro per categoria. Valori fuori enum → `400`.
        - in: query
          name: proprietario
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          required: false
          description: |
            ObjectId del proprietario. Ammesso solo se coincide con l'id del JWT,
            altrimenti `403`. Quando presente e valido, i risultati includono il
            campo `proprietario` nella risposta.
      responses:
        '200':
          description: Lista delle strutture (può essere vuota).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StruttureListResponse'
              example:
                count: 1
                strutture:
                  - _id: 65b4f4e7b8d9c1f4a2e5b6a9
                    nome: Bar Centrale
                    categoria: bar
                    indirizzo: Via Belenzani 14, 38122 Trento TN
                    geolocalizzazione:
                      type: Point
                      coordinates: [11.1217, 46.0667]
                    proprietario: 65a3f4e7b8d9c1f4a2e5b6c8
                    createdAt: '2026-05-15T10:00:00.000Z'
                    updatedAt: '2026-05-15T10:00:00.000Z'
        '400':
          description: |
            Filtri non validi. Possibili cause:
            - `bbox` mal formato o coordinate fuori range
            - `categoria` fuori enum
            - `proprietario` non è un ObjectId valido (24 hex)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: bbox
                    message: 'formato atteso: minLng,minLat,maxLng,maxLat'
        '401':
          description: Token mancante, non valido o scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativo di filtrare per un `proprietario` diverso dal proprio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Accesso negato. Puoi filtrare solo per il tuo id.
        '500':
          description: Errore interno del server.

  /geocode:
      get:
        tags:
          - Routing
        summary: Traduce un indirizzo testuale in coordinate geografiche
        description: |
          Risolve una stringa di ricerca (indirizzo, luogo, punto di interesse) in
          una lista di coordinate candidate, tramite il servizio **Nominatim** di
          OpenStreetMap.

          ## Disambiguazione lato client
          Un indirizzo testuale è intrinsecamente ambiguo (es. "Via Roma" esiste in
          molte città). L'endpoint restituisce quindi un **array di candidati**
          ordinati per rilevanza: è il client a scegliere quale sia quello corretto.
          Se nessun candidato corrisponde, l'array è vuoto (`count: 0`) con stato `200`.

          ## Vincolo geografico
          I risultati sono limitati a una bounding box che circoscrive il
          Trentino-Alto Adige, coerente con l'area coperta dal motore di routing.
          Indirizzi fuori da tale area non vengono restituiti.

          ## Comportamento server-side
          - La query viene inoltrata a Nominatim con un `User-Agent` identificativo
            (requisito della usage policy del servizio).
          - Ogni risultato è normalizzato in `{ label, lng, lat }`, indipendente dal
            formato grezzo del provider.
          - L'operazione è di sola lettura, idempotente, senza side-effect.
        operationId: geocodeIndirizzo
        security:
          - bearerAuth: []
        parameters:
          - name: q
            in: query
            required: true
            description: |
              Stringa di ricerca dell'indirizzo o luogo. Minimo 3 caratteri
              (stringhe più corte producono `400`).
            schema:
              type: string
              minLength: 3
            example: Piazza Duomo Trento
        responses:
          '200':
            description: |
              Lista dei candidati corrispondenti alla ricerca. Può essere vuota se
              nessun luogo corrisponde alla query entro l'area consentita.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/GeocodeResponse'
                example:
                  count: 1
                  candidati:
                    - label: "Piazza del Duomo, Centro storico, Trento, Trentino-Alto Adige, Italia"
                      lng: 11.1214267
                      lat: 46.0673519
          '400':
            $ref: '#/components/responses/ValidationError'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '502':
            description: |
              Il servizio di geocoding esterno (Nominatim) è irraggiungibile o ha
              risposto con un errore. Si tratta di un guasto del servizio a monte,
              non di un problema dell'input.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  error: Servizio di geocoding non disponibile
          '500':
            $ref: '#/components/responses/InternalServerError'

  /routes:
    get:
      tags:
        - Routing
      summary: Calcola un percorso pedonale verso una destinazione
      description: |
        Calcola il tragitto pedonale dalla posizione dell'utente a una
        destinazione, tramite motore di routing **Valhalla** self-hosted con
        costing `pedestrian`.

        ## Origine hardcoded (fase attuale)
        In questa fase di sviluppo l'origine è **fissata al centro di Trento**
        (`[11.1211, 46.0667]`) e non viene rilevata dalla geolocalizzazione reale.
        Il client NON fornisce l'origine. In una fase successiva l'origine sarà
        derivata dalla posizione del cittadino autenticato.

        ## Output
        La risposta contiene la geometria del percorso come **GeoJSON LineString**
        (array di coordinate `[lng, lat]`), pronta per il rendering su mappa, più
        distanza in metri e durata stimata in secondi.

        Quando il filtro profilo è attivo, la risposta include anche l'array
        `ostacoli_esclusi` con i punti che Valhalla ha ricevuto come
        `exclude_locations` utile al client per mostrare un indicatore visivo
        degli ostacoli bypassati sul tracciato.

        ## Natura stateless
        Il percorso NON viene persistito: è un dato derivato e deperibile, funzione
        dello stato corrente della rete. Ogni chiamata ricalcola il tragitto.
        L'operazione è idempotente e priva di side-effect.

        ## Filtro profilo disabilità (US11)
        Se l'utente autenticato è un `cittadino` con `profiloDisabilita` non vuoto,
        il sistema recupera automaticamente le segnalazioni attive incompatibili con
        il suo profilo nell'area del percorso e le passa a Valhalla come
        `exclude_locations`, così da ricalcolare il tragitto evitando quegli archi.

        **Il profilo viene sempre letto dal JWT** non è un parametro client.
        Un cittadino non può simulare un profilo diverso dal proprio.

        **Definizione di «segnalazione attiva»:**
        - `stato ∈ {APERTA, IN_VERIFICA, PRESA_IN_CARICO}` escluse RISOLTA e ARCHIVIATA
        - Per le segnalazioni private: anche `visibile: true` (solo quelle validate dalla community)

        **Mapping categoria → profilo incompatibile:**

        | Categoria                  | Profili bloccati                               |
        |----------------------------|------------------------------------------------|
        | marciapiede_rotto          | sediaARotelle, ausilioDeambulazione            |
        | pavimentazione_dissestata  | sediaARotelle, ausilioDeambulazione            |
        | scalino_non_segnalato      | sediaARotelle, ausilioDeambulazione, cecita    |
        | mancanza_rampa (pubblica)  | sediaARotelle, ausilioDeambulazione            |
        | ostacolo_temporaneo        | sediaARotelle, cecita                          |
        | auto_sosta_vietata         | sediaARotelle, cecita                          |
        | semaforo_non_accessibile   | cecita                                         |
        | mancanza_rampa (privata)   | sediaARotelle, ausilioDeambulazione            |
        | ascensore_guasto           | sediaARotelle, ausilioDeambulazione            |
        | spazi_interni_stretti      | sediaARotelle                                  |
        | altro                      | (nessuno — troppo generico per bloccare)       |

        `sordita` non è bloccata da nessuna categoria: non genera barriere
        fisiche al transito pedonale.

        Se `profiloDisabilita` è `[]` o l'utente non è un `cittadino`, nessun
        filtro viene applicato e il comportamento è identico alla versione
        pre-US11 (nessuna `exclude_locations` passata a Valhalla).

        ## Distinzione degli errori
        - **`422`**: la destinazione è una coordinata valida ma **non raggiungibile
          a piedi** (punto isolato dalla rete pedonale, fuori dall'area coperta, o
          distanza oltre il limite pedonale). Non è un guasto: nessun percorso esiste.
        - **`502`**: il motore di routing è **irraggiungibile** (servizio spento o
          errore interno). Guasto reale del servizio a monte.
      operationId: calcolaPercorso
      security:
        - bearerAuth: []
      parameters:
        - name: to
          in: query
          required: true
          description: |
            Coordinate della destinazione nel formato `lng,lat` (due numeri
            separati da virgola, ordine GeoJSON: prima longitudine, poi latitudine).
            Range: longitudine ∈ [-180, 180], latitudine ∈ [-90, 90].
            Tipicamente ottenute da una precedente chiamata a `GET /geocode`.
          schema:
            type: string
          example: "11.1214267,46.0673519"
      responses:
        '200':
          description: |
            Percorso pedonale calcolato con successo.
            Se il filtro profilo è attivo, `ostacoli_esclusi` contiene i punti
            passati a Valhalla come `exclude_locations`; altrimenti è un array vuoto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
              examples:
                senza_filtro:
                  summary: Utente senza profilo disabilità (nessun filtro)
                  value:
                    origin:
                      lng: 11.1211
                      lat: 46.0667
                    destination:
                      lng: 11.1214267
                      lat: 46.0673519
                    geometry:
                      type: LineString
                      coordinates:
                        - [11.121115, 46.066743]
                        - [11.121054, 46.066753]
                        - [11.121305, 46.0673]
                        - [11.121298, 46.067342]
                    distance: 79
                    duration: 56
                    ostacoli_esclusi: []
                con_filtro:
                  summary: Cittadino con sediaARotelle (2 ostacoli esclusi)
                  value:
                    origin:
                      lng: 11.1211
                      lat: 46.0667
                    destination:
                      lng: 11.1214267
                      lat: 46.0673519
                    geometry:
                      type: LineString
                      coordinates:
                        - [11.121115, 46.066743]
                        - [11.120890, 46.066910]
                        - [11.121298, 46.067342]
                    distance: 134
                    duration: 96
                    ostacoli_esclusi:
                      - segnalazioneId: 65b1a2c3d4e5f6a7b8c9d0e1
                        categoria: mancanza_rampa
                        tipo: pubblica
                        lng: 11.121054
                        lat: 46.066753
                      - segnalazioneId: 65b1a2c3d4e5f6a7b8c9d0e2
                        categoria: marciapiede_rotto
                        tipo: pubblica
                        lng: 11.121170
                        lat: 46.066820
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Destinazione non raggiungibile a piedi. La coordinata è formalmente
            valida ma non esiste alcun percorso pedonale: punto isolato dalla rete
            stradale, fuori dall'area coperta dai dati cartografici, oppure tragitto
            oltre la distanza massima pedonale.

            **Nota:** può verificarsi anche quando il filtro profilo esclude così
            tanti archi da rendere irraggiungibile la destinazione. In questo caso
            il messaggio di errore lo segnala esplicitamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                destinazione_irraggiungibile:
                  value:
                    error: Nessun percorso pedonale raggiungibile verso la destinazione indicata
                irraggiungibile_per_filtro:
                  value:
                    error: >-
                      Nessun percorso disponibile compatibile con il profilo disabilità.
                      Prova a disabilitare il filtro o a scegliere una destinazione alternativa.
        '502':
          description: |
            Il motore di routing (Valhalla) è irraggiungibile o ha restituito un
            errore non riconducibile all'input. Guasto del servizio a monte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Servizio di routing temporaneamente non disponibile
        '500':
          $ref: '#/components/responses/InternalServerError'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT ottenuto da `POST /auth/login` o `POST /auth/register/*`.
        Scadenza: 2 ore. Header atteso: `Authorization: Bearer <token>`.

  schemas:

    LoginRequest:
      type: object
      description: Payload per il login.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345

    LoginResponse:
      type: object
      description: Risposta login.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Login avvenuto con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_login
        user:
          $ref: '#/components/schemas/UserPublic'

    RegisterCitizenRequest:
      type: object
      description: Payload registrazione cittadino.
      required:
        - email
        - password
        - nome
        - cognome
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi

    RegisterOwnerRequest:
      type: object
      description: Payload registrazione proprietario.
      required:
        - email
        - password
        - nome
        - cognome
        - partitaIVA
      properties:
        email:
          type: string
          format: email
          example: proprietario@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          example: Luigi
        cognome:
          type: string
          example: Bianchi
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'

    RegisterResponse:
      type: object
      description: Risposta registrazione.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Registrazione avvenuta con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      description: |
        Rappresentazione pubblica utente. Alcuni campi sono presenti solo
        per specifici ruoli (es. `profiloDisabilita`/`scoreAffidabilita` per cittadini,
        `partitaIVA` per proprietari).
      required:
        - _id
        - email
        - nome
        - cognome
        - ruolo
        - createdAt
      properties:
        _id:
          type: string
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi
        ruolo:
          type: string
          enum: [cittadino, proprietario, operatore]
          example: cittadino
        profiloDisabilita:
          type: array
          description: Presente solo per ruolo `cittadino`.
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle, cecita]
        scoreAffidabilita:
          type: number
          minimum: 0
          description: Presente solo per ruolo `cittadino`.
          example: 0
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      description: |
        Payload per l'aggiornamento parziale del profilo (semantica PATCH).
        Tutti i campi sono opzionali, ma il body deve contenere almeno
        un campo modificabile presente nella whitelist.
      properties:
        nome:
          type: string
          description: Nuovo nome dell'utente. Modificabile da tutti i ruoli.
          example: Mario Pasquale
        cognome:
          type: string
          description: Nuovo cognome dell'utente. Modificabile da tutti i ruoli.
          example: Rossi
        profiloDisabilita:
          type: array
          description: |
            Array delle disabilità. Sovrascrive completamente il valore esistente.
            Riservato al ruolo `cittadino`.
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle]

    GetProfileResponse:
      type: object
      required:
        - user
      description: |
        Risposta di `GET /users/me`. Contiene la rappresentazione pubblica
        dell'utente autenticato. I campi presenti dipendono dal ruolo.
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'

    UpdateProfileResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Profilo aggiornato con successo
        user:
          $ref: '#/components/schemas/UserPublic'

    CategoriaBarrieraPubblica:
      type: string
      description: Categoria della barriera architettonica o ostacolo segnalato su suolo pubblico.
      enum:
        - marciapiede_rotto
        - ostacolo_temporaneo
        - auto_sosta_vietata
        - scalino_non_segnalato
        - pavimentazione_dissestata
        - mancanza_rampa
        - semaforo_non_accessibile
        - altro

    CategoriaBarrieraPrivata:
      type: string
      description: Categoria della barriera architettonica o ostacolo segnalato su suolo privato.
      enum:
        - mancanza_rampa
        - bagno_non_accessibile
        - ascensore_guasto
        - spazi_interni_stretti
        - altro

    StatoSegnalazione:
      type: string
      description: |
        Stato del ciclo di vita della segnalazione.
        Per `SegnalazionePubblica` lo stato `IN_VERIFICA` è proibito
        (vincolo OCL Deliverable 2, §3.3).
      enum:
        - APERTA
        - IN_VERIFICA
        - PRESA_IN_CARICO
        - RISOLTA
        - ARCHIVIATA

    GeoJSONPoint:
      type: object
      description: |
        Oggetto geografico in formato **GeoJSON Point** (RFC 7946).
        Usato per indicizzazione spaziale MongoDB tramite indice `2dsphere`.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
          example: Point
        coordinates:
          type: array
          description: |
            Array di 2 numeri nell'ordine `[longitudine, latitudine]`.
            Range: longitudine ∈ [-180, 180], latitudine ∈ [-90, 90].
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [11.1217, 46.0700]

    SegnalazioneBase:
      type: object
      description: |
        Schema base condiviso tra `SegnalazionePubblica` e `SegnalazionePrivata`.
        Corrisponde al modello Mongoose con `discriminatorKey: 'tipo'`.
      properties:
        _id:
          type: string
          pattern: '^[a-f0-9]{24}$'
          example: 65b4f4e7b8d9c1f4a2e5b6d1
        tipo:
          type: string
          enum: [pubblica, privata]
          description: Discriminator key.
        descrizione:
          type: string
          minLength: 10
          maxLength: 1000
        categoria:
          $ref: '#/components/schemas/CategoriaBarrieraPubblica'
        stato:
          $ref: '#/components/schemas/StatoSegnalazione'
        geolocalizzazione:
          $ref: '#/components/schemas/GeoJSONPoint'
        foto:
          type: array
          description: |
            Array di URL relativi delle foto caricate. Formato filename:
            `{timestamp}-{nome_originale_sanitizzato}.{ext}`.
          maxItems: 5
          items:
            type: string
            example: /uploads/reports/1747320000000-foto_marciapiede.jpg
        autore:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId del cittadino che ha creato la segnalazione.
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        bloccaModifica:
          type: boolean
          description: |
            Se `true`, la segnalazione è in stato terminale e non
            modificabile (es. RISOLTA, ARCHIVIATA).
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-05-15T09:20:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-15T09:20:00.000Z'

    CreateSegnalazionePubblicaForm:
      type: object
      description: |
        Payload `multipart/form-data` per la creazione di una segnalazione
        pubblica. La geolocalizzazione è espressa come due campi piatti
        (`longitudine`, `latitudine`) ricomposti server-side in `GeoJSONPoint`.
      properties:
        descrizione:
          type: string
          minLength: 10
          maxLength: 1000
          description: Descrizione testuale della barriera.
          example: Marciapiede dissestato in prossimità delle strisce pedonali.
        categoria:
          $ref: '#/components/schemas/CategoriaBarrieraPubblica'
        longitudine:
          type: string
          description: |
            Longitudine GPS (valore numerico trasmesso come stringa per
            limite di `multipart/form-data`). Range [-180, 180].
          example: '11.1217'
        latitudine:
          type: string
          description: |
            Latitudine GPS (valore numerico trasmesso come stringa per
            limite di `multipart/form-data`). Range [-90, 90].
          example: '46.0700'
        foto:
          type: array
          description: |
            Array di file immagine. Massimo 5 file, ciascuno ≤ 5MB.
            MIME ammessi: `image/jpeg`, `image/png`, `image/webp`.
            Campo opzionale: una segnalazione può essere creata senza foto.
          maxItems: 5
          items:
            type: string
            format: binary

    SegnalazionePubblica:
      description: |
        Rappresentazione completa di una segnalazione su suolo pubblico
        (discriminator `tipo = "pubblica"`).
      allOf:
        - $ref: '#/components/schemas/SegnalazioneBase'
        - type: object
          properties:
            tipo:
              type: string
              enum: [pubblica]
            enteCompetente:
              type: string
              nullable: true
              pattern: '^[a-f0-9]{24}$'
              description: |
                ObjectId dell'operatore comunale assegnato. `null` finché non
                avviene l'assegnazione.
              example: null

    CreateSegnalazionePubblicaResponse:
      type: object
      description: Risposta alla creazione di una segnalazione pubblica.
      required:
        - message
        - segnalazione
      properties:
        message:
          type: string
          example: Segnalazione creata con successo
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePubblica'

    CreateSegnalazionePrivataForm:
      type: object
      description: |
        Payload `multipart/form-data` per la creazione di una segnalazione privata.
        Identico a `CreateSegnalazionePubblicaForm` con in più il campo obbligatorio
        `strutturaAssociata`.
      properties:
        strutturaAssociata:
          type: string
          description: L'ObjectId della StrutturaPrivata a cui associare la segnalazione.
          example: 65b4f4e7b8d9c1f4a2e5b6a9
        descrizione:
          type: string
          minLength: 10
          maxLength: 1000
          example: "Assenza di rampa all'ingresso del locale, impossibile entrare con sedia a rotelle."
        categoria:
          $ref: '#/components/schemas/CategoriaBarrieraPrivata'
        longitudine:
          type: string
          description: Range [-180, 180].
          example: '11.1217'
        latitudine:
          type: string
          description: Range [-90, 90].
          example: '46.0700'
        foto:
          type: array
          maxItems: 5
          items:
            type: string
            format: binary

    SegnalazionePrivata:
      description: |
        Rappresentazione di una segnalazione su struttura privata
        (discriminator `tipo = "privata"`).
      allOf:
        - $ref: '#/components/schemas/SegnalazioneBase'
        - type: object
          properties:
            tipo:
              type: string
              enum: [privata]
            strutturaAssociata:
              type: string
              pattern: '^[a-f0-9]{24}$'
              description: ObjectId della `StrutturaPrivata` associata.
              example: 65b4f4e7b8d9c1f4a2e5b6a9
            scoreAssociato:
              type: number
              minimum: 0
              description: Punteggio accumulato tramite endorsement crowdsourcing.
              example: 0
            sogliaValidazione:
              type: number
              description: Soglia di score per rendere visibile la segnalazione.
              example: 10
            listaValidatori:
              type: array
              description: Array di ObjectId dei cittadini che hanno supportato la segnalazione (evita voti doppi).
              items:
                type: string
                pattern: '^[a-f0-9]{24}$'
              example: []
            numAnomalie:
              type: integer
              minimum: 0
              description: Contatore di comportamenti anomali rilevati.
              example: 0
            sogliaAllarme:
              type: integer
              description: Soglia di anomalie oltre la quale viene generato un allarme al comune.
              example: 5
            visibile:
              type: boolean
              description: |
                Se `false`, la segnalazione non appare sulla mappa pubblica.
                Diventa `true` solo quando `scoreAssociato >= sogliaValidazione`.
              example: false

    CreateSegnalazionePrivataResponse:
      type: object
      properties:
        message:
          type: string
          example: Segnalazione privata creata con successo ed in attesa di validazione
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePrivata'

    StrutturaPrivata:
      type: object
      description:  |
        Rappresentazione di una struttura privata registrata da un proprietario.
        Le strutture sono il "target" delle segnalazioni private.
      properties:
        _id:
          type: string
          example: 65b4f4e7b8d9c1f4a2e5b6a9
        nome:
          type: string
          minLength: 2
          maxLength: 100
          example: Bar Centrale
        categoria:
          type: string
          enum:
            - ristorante
            - bar
            - negozio
            - ufficio
            - hotel
            - studio_medico
            - palestra
            - altro
          example: bar
        indirizzo:
          type: string
          minLength: 5
          maxLength: 200
          example: Via Roma 12, Trento
        geolocalizzazione:
          $ref: '#/components/schemas/GeoJSONPoint'
        proprietario:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId del proprietario che ha registrato la struttura.
          example: 65a3f4e7b8d9c1f4a2e5b6c8
        stato:
          type: string
          enum: [attiva, dismessa]
          default: attiva
          example: attiva
        createdAt:
          type: string
          format: date-time
          example: '2026-05-14T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-14T10:00:00.000Z'

    CreateStrutturaRequest:
      type: object
      description: Payload JSON per la registrazione di una struttura privata.
      required:
        - nome
        - categoria
        - indirizzo
        - geolocalizzazione
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 100
          example: Bar Centrale
        categoria:
          type: string
          enum:
            - ristorante
            - bar
            - negozio
            - ufficio
            - hotel
            - studio_medico
            - palestra
            - altro
          example: bar
        indirizzo:
            type: string
            minLength: 5
            maxLength: 200
            example: Via Belenzani 14, 38122 Trento TN
        geolocalizzazione:
            $ref: '#/components/schemas/GeoJSONPoint'
    
    CreateStrutturaResponse:
      type: object
      required:
        - message
        - struttura
      properties:
        message:
          type: string
          example: Struttura registrata con successo
        struttura:
          $ref: '#/components/schemas/StrutturaPrivata'

    StruttureListResponse:
      type: object
      required:
        - count
        - strutture
      properties:
        count:
          type: integer
          description: Numero di strutture nell'array (può essere 0).
        strutture:
          type: array
          items:
            $ref: '#/components/schemas/StrutturaPrivata'

    GeocodeCandidate:
      type: object
      description: Singolo candidato risultante da una ricerca di geocoding.
      required:
        - label
        - lng
        - lat
      properties:
        label:
          type: string
          description: Etichetta human-readable completa del luogo (display_name di Nominatim).
          example: "Piazza del Duomo, Centro storico, Trento, Trentino-Alto Adige, Italia"
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitudine.
          example: 11.1214267
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitudine.
          example: 46.0673519

    GeocodeResponse:
      type: object
      description: Risposta della ricerca di geocoding. L'array può essere vuoto.
      required:
        - count
        - candidati
      properties:
        count:
          type: integer
          minimum: 0
          description: Numero di candidati restituiti (può essere 0).
          example: 1
        candidati:
          type: array
          items:
            $ref: '#/components/schemas/GeocodeCandidate'

    Coordinate:
      type: object
      description: Coppia di coordinate geografiche.
      required:
        - lng
        - lat
      properties:
        lng:
          type: number
          format: double
          example: 11.1211
        lat:
          type: number
          format: double
          example: 46.0667

    RouteGeometry:
      type: object
      description: |
        Geometria del percorso in formato GeoJSON LineString. Ogni elemento
        di `coordinates` è una coppia `[longitudine, latitudine]`.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [LineString]
          example: LineString
        coordinates:
          type: array
          description: Sequenza ordinata di vertici del percorso, ordine `[lng, lat]`.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          example:
            - [11.121115, 46.066743]
            - [11.121305, 46.0673]
    
    OstacoloEscluso:
      type: object
      description: |
        Rappresentazione di una segnalazione attiva esclusa dal percorso
        perché incompatibile con il profilo disabilità del cittadino.
        Corrisponde a un punto passato a Valhalla come `exclude_locations`.
      required:
        - segnalazioneId
        - categoria
        - tipo
        - lng
        - lat
      properties:
        segnalazioneId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId M

    RouteResponse:
      type: object
      description: Percorso pedonale calcolato tra origine e destinazione.
      required:
        - origin
        - destination
        - geometry
        - distance
        - duration
      properties:
        origin:
          $ref: '#/components/schemas/Coordinate'
        destination:
          $ref: '#/components/schemas/Coordinate'
        geometry:
          $ref: '#/components/schemas/RouteGeometry'
        distance:
          type: integer
          minimum: 0
          description: Lunghezza totale del percorso in metri.
          example: 79
        duration:
          type: integer
          minimum: 0
          description: Durata stimata del percorso a piedi, in secondi.
          example: 56

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Messaggio di errore human-readable.
          example: Errore interno del server

    ValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Validazione fallita
        details:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Nome del campo che ha fallito la validazione.
                example: categoria
              message:
                type: string
                description: Messaggio di errore specifico del campo.
                example: 'categoria "marciapide" non ammessa'
  
  responses:
    ValidationError:
      description: |
        Dati di input non validi. Il body contiene la lista dei campi che hanno fallito la validazione.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: Validazione fallita
            details:
              - field: email
                message: Formato email non valido

    Unauthorized:
      description: |
        Autenticazione mancante o non valida. Possibili cause:
        - header `Authorization: Bearer <token>` (o `x-access-token`) assente
        - token JWT malformato
        - token JWT scaduto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tokenMancante:
              value:
                error: Token mancante
            tokenScaduto:
              value:
                error: Token scaduto
            tokenNonValido:
              value:
                error: Token non valido

    Forbidden:
      description: |
        Autenticazione valida ma il ruolo dell'utente non è autorizzato per l'operazione.
        Esempi: un proprietario tenta di creare una segnalazione (operazione riservata ai cittadini),
        un cittadino tenta di moderare segnalazioni in verifica (operazione riservata agli operatori).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Accesso negato: ruolo non autorizzato'

    InternalServerError:
      description: Errore interno del server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Errore interno del server