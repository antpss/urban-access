openapi: 3.0.3

info:
  title: UrbanAccess API
  description: |
    REST API per il sistema **UrbanAccess**, una piattaforma di mappatura crowdsourcing
    dell'accessibilità urbana.

    ## Convenzioni
    - Tutte le risposte sono in formato JSON.
    - Architettura RESTful e stateless.
    - Password encryption via bcrypt.
    - Autenticazione tramite JWT.

    ## Modello utenti
    Il sistema distingue tre ruoli principali: `cittadino`, `proprietario` e `operatore`.

    ## Architettura registrazione
    La registrazione è segmentata per ruolo tramite endpoint dedicati:
    - `POST /auth/register/citizen` — registrazione cittadini
    - `POST /auth/register/owner` — registrazione proprietari
    - **Operatori comunali**: NON registrabili via API pubblica.
      Creati esclusivamente tramite seed script o shell Mongoose dall'amministratore.

    Il payload di registrazione è **minimale** per i cittadini (solo identità).
    I proprietari aggiungono `partitaIVA` poiché sono dati legalmente
    necessari per identificare un'attività commerciale.

    ## Gestione del profilo utente
    Dopo la registrazione, il profilo dell'utente può essere modificato parzialmente tramite `PATCH /users/me`.
    L'endopoint segue il pattern PATCH parziale: il body contiene solo i campi da modificare. I campi modificabili sono
    gestiti server-side tramite una whitelist con vincoli per ogni campo (ruolo, validazione, trasformazione).

    Attualmente l'unico campo modificabile è `profiloDisabilita`, riservato ai cittadini, che accetta un array di disabilità.

    ## Asset statici (foto segnalazioni)
    Le foto caricate dai cittadini in `POST /segnalazioni/pubbliche` vengono
    salvate su disco e servite come asset statici da `GET /uploads/segnalazioni/{filename}`.
    Tali URL **NON** sono parte dell'API REST documentata: sono risorse pubbliche
    raggiungibili direttamente.

  version: 1.0.0
  contact:
    name: Gruppo 17 - UrbanAccess - Andrea Boarini, Antonio Possemato, Giovanni Todesco
    email: decideremaildicontatto@gmail.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Server di sviluppo locale

tags:
  - name: Authentication
    description: Endpoint per registrazione e accesso degli utenti
  - name: Users
    description: Gestione del profilo utente autenticato
  - name: Segnalazioni
    description: |
      Gestione delle segnalazioni di barriere architettoniche e ostacoli.
      Le segnalazioni si dividono in **pubbliche** (suolo pubblico, immediatamente
      visibili) e **private** (strutture private, soggette a validazione crowdsourcing).

paths:

  /auth/register/citizen:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo cittadino
      description: |
        Crea un nuovo account di tipo `cittadino` nel sistema.

        **Payload minimale**: solo dati anagrafici e credenziali.
        I dati di profilazione (profilo disabilità, ecc.) sono gestiti
        tramite endpoint dedicati post-registrazione.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - Lo `scoreAffidabilita` viene inizializzato a `0`.
        - `profiloDisabilita` ha default `nessuna`.
        - `storicoPercorsi` e `storicoSegnalazioni` inizializzati come array vuoti.
      operationId: registraCittadino
      requestBody:
        required: true
        description: Dati anagrafici e credenziali del nuovo cittadino.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
              nome: Mario
              cognome: Rossi
      responses:
        '201':
          description: Cittadino registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_citizen
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: []
                  scoreAffidabilita: 0
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (email, password, nome, cognome)
            - formato email non valido
            - password troppo corta (< 8 caratteri) o troppo lunga (> 128 caratteri)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: email
                    message: Formato email non valido
                  - field: password
                    message: Password minimo 8 caratteri
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/register/owner:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo proprietario di struttura
      description: |
        Crea un nuovo account di tipo `proprietario` nel sistema.

        **Differenze rispetto al cittadino:**
        - Richiede `partitaIVA` (11 cifre, identificatore fiscale italiano).

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - `partitaIVA` deve essere univoca nel sistema.
        - `strutture` inizializzato come array vuoto.
      operationId: registraProprietario
      requestBody:
        required: true
        description: Dati anagrafici, credenziali e dati commerciali del proprietario.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              email: proprietario@example.com
              password: SecurePassword12345
              nome: Luigi
              cognome: Bianchi
              partitaIVA: '12345678901'
      responses:
        '201':
          description: Proprietario registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_owner
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c8
                  email: proprietario@example.com
                  nome: Luigi
                  cognome: Bianchi
                  ruolo: proprietario
                  profiloDisabilita: []
                  scoreAffidabilita: 0
                  createdAt: '2026-05-12T14:35:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (email, password, nome, cognome, partitaIVA)
            - formato email non valido
            - password troppo corta (< 8 caratteri) o troppo lunga (> 128 caratteri)
            - formato partitaIVA non valido (deve essere esattamente 11 cifre numeriche)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: email
                    message: Formato email non valido
                  - field: password
                    message: Password minimo 8 caratteri
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login utente
      description: |
        Autentica un utente esistente (cittadino o proprietario) tramite
        email e password, restituendo un **token JWT** da usare nelle richieste successive.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima della ricerca.
        - La password viene confrontata con l'hash bcrypt salvato in DB.
        - In caso di successo viene generato un token JWT firmato con `JWT_SECRET`,
          contenente `userId`, `ruolo` e scadenza a **2 ore**.
        - Il token deve essere incluso nell'header `Authorization: Bearer <token>`
          per accedere agli endpoint protetti.

        **Sicurezza:**
        - In caso di email non trovata o password errata viene restituito sempre
          `401 Unauthorized` con messaggio generico, senza specificare quale
          dei due campi è errato (prevenzione user enumeration).
      operationId: loginUtente
      requestBody:
        required: true
        description: Credenziali di accesso.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
      responses:
        '200':
          description: Login effettuato con successo. Restituisce il token JWT e i dati pubblici dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login effettuato con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2NWEzZjRlN2I4ZDljMWY0YTJlNWI2YzciLCJydW9sbyI6ImNpdHRhZGlubyIsImlhdCI6MTc0NzA1NjIwMCwiZXhwIjoxNzQ3MTQyNjAwfQ.example
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (email o password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: email
                    message: email è obbligatoria
        '401':
          description: |
            Credenziali non valide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Credenziali non valide
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /users/me:
    patch:
      tags:
        - Users
      summary: Aggiorna il profilo dell'utente autenticato
      description: |
        Aggiorna parzialmente il profilo dell'utente identificato dal JWT.

        **Semantica PATCH:**
        Il payload descrive i campi da modificare. Ciò che non è specificato nel body resta invariato.
        Se viene specificato un campo, il suo valore sovrascrive completamente quello esistente.

        **Campi modificabili da whitelist:**
        Attualmente è ammesso solo l'aggiornamento di `profiloDisabilita`
        (riservato al ruolo `cittadino`).
        I valori accettati sono: `sediaARotelle`, `cecita`, `sordita`, `ausilioDeambulazione`.

        **Future estensioni:**
        In futuro l'endpoint in questione accoglierà ulteriori campi modificabili (nome, cognome, ecc.)
        tramite estensione della whitelist. Il contratto tuttavia non varia, stesso endpoint, body diverso.

        **Comportamento server-side:**
        - L'`userId` viene estratto dal JWT.
        - I valori duplicati nell'array vengono deduplicati lato server.
        - Valori non ammessi nell'enum producono Errore 400.
        - Campi non presenti nella whitelist dei modificabili vengono ignorati.
        - Body vuoto (nessun campo modificabile presente) produce Errore 400.

        **Verifica sul token:**
        - Se il token non è valido o scaduto produce Errore 401.
        - Se il token è valido ma l'utente non esiste più (es. eliminato) produce Errore 404.
        - Se il token passato appartiene a un utente diverso da `cittadino` produce Errore 403 segnalado l'impossiblità di modificare i campi
        non esistenti come attributi. Questo garantisce che solo chi ha un dato attributo possa modificarlo, evitando false chiamate da parte di utenti con ruoli diversi.
      operationId: aggiornaProfiloUtente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              profiloDisabilita: [sediaARotelle, cecita]
      responses:
        '200':
          description: Profilo aggiornato con successo. Ritorna la rappresentazione completa dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message: Profilo aggiornato con successo
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: [sediaARotelle, cecita]
                  scoreAffidabilita: 0
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          description: |
            Payload non valido. Possibili cause:
            - body vuoto o senza alcun campo modificabile
            - `profiloDisabilita` non è un array
            - `profiloDisabilita` contiene valori fuori enum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: profiloDisabilita
                    message: 'Valori non ammessi: foo, bar'
        '401':
          description: |
            Autenticazione fallita. Possibili cause:
            - token mancante nell'header `Authorization`
            - token non valido (firma errata, formato errato, ecc.)
            - token scaduto (oltre 24 ore dalla generazione)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token scaduto
        '403':
          description: |
            Ruolo autenticato ma non autorizzato.
            Si verifica quando si tenta di modificare un campo riservato a un ruolo diverso dal proprio
            (es. un `proprietario` che tenta di modificare `profiloDisabilita` riservato ai `cittadino`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Modifica del campo "profiloDisabilita" non permessa per il ruolo "proprietario"
        '404':
          description: Utente non trovato. Si verifica quando il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /segnalazioni/pubbliche:
    post:
      tags:
        - Segnalazioni
      summary: Crea una nuova segnalazione su suolo pubblico
      description: |
        Permette a un cittadino autenticato di creare una nuova segnalazione
        di barriera architettonica o ostacolo su **suolo pubblico**.

        ## Content-Type
        L'endpoint accetta **esclusivamente** `multipart/form-data` perché
        consente l'upload di file binari (foto) insieme ai metadati testuali.
        L'invio come `application/json` produce errore.

        ## Geolocalizzazione
        Per coerenza con i limiti tecnici di `multipart/form-data` (che non
        supporta nativamente oggetti annidati), le coordinate sono trasmesse
        come due campi piatti `longitudine` e `latitudine` (stringhe numeriche).
        Il server le converte e assembla un oggetto **GeoJSON `Point`**
        nel formato `{ type: "Point", coordinates: [lng, lat] }` prima del
        salvataggio, per essere indicizzabile con un indice MongoDB `2dsphere`.

        **Ordine coordinate**: GeoJSON usa `[longitudine, latitudine]`,
        contro-intuitivo rispetto a Google Maps. Il client deve passare
        i due campi separati e non un array, per ridurre il rischio di
        inversione.

        ## Foto
        Massimo **5 file**, ciascuno **≤ 5MB**, estensioni ammesse:
        `image/jpeg`, `image/png`, `image/webp`. Il server rifiuta file che non 
        rispettano questi vincoli.

        ## Stato iniziale
        Le segnalazioni pubbliche partono in stato `APERTA` e sono
        **immediatamente visibili** sulla mappa.
        Vincolo OCL (Deliverable 2, §3.3): una `SegnalazionePubblica`
        non può mai trovarsi in stato `IN_VERIFICA`.

        ## Comportamento server-side
        - L'`autore` viene impostato dal JWT, non dal client (mitigazione spoofing).
        - In caso di fallimento del salvataggio su DB dopo che i file sono
          già stati scritti su disco, il server tenta un cleanup dei file orfani.
      operationId: creaSegnalazionePubblica
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSegnalazionePubblicaForm'
            encoding:
              foto:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Segnalazione creata con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/segnalazioni/65b4f4e7b8d9c1f4a2e5b6d1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSegnalazioneResponse'
              example:
                message: Segnalazione creata con successo
                segnalazione:
                  _id: 65b4f4e7b8d9c1f4a2e5b6d1
                  tipo: pubblica
                  descrizione: Marciapiede dissestato in prossimità delle strisce pedonali, impraticabile per sedia a rotelle.
                  categoria: marciapiede_rotto
                  stato: APERTA
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0700]
                  foto:
                    - /uploads/segnalazioni/1715760000000_a1b2c3d4e5f6.jpg
                  autore: 65a3f4e7b8d9c1f4a2e5b6c7
                  enteCompetente: null
                  bloccaModifica: false
                  createdAt: '2026-05-15T09:20:00.000Z'
                  updatedAt: '2026-05-15T09:20:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (`descrizione`, `categoria`, `longitudine`, `latitudine`)
            - `categoria` fuori enum
            - coordinate fuori range (`longitudine` ∉ [-180, 180], `latitudine` ∉ [-90, 90])
            - coordinate non numeriche
            - `descrizione` troppo breve (< 10 caratteri) o troppo lunga (> 1000)
            - Content-Type diverso da `multipart/form-data`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: categoria
                    message: 'categoria "marciapide" non ammessa'
                  - field: latitudine
                    message: 'coordinate non valide: lat∈[-90,90]'
        '401':
          description: Token mancante, non valido o scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token non valido o scaduto
        '403':
          description: |
            Ruolo non autorizzato. Solo il ruolo `cittadino` può creare
            segnalazioni pubbliche da questo endpoint. Operatori comunali
            utilizzano un endpoint dedicato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Accesso negato: ruolo non autorizzato'
        '413':
          description: |
            Payload troppo grande. Cause:
            - singolo file > 5MB
            - somma totale del body oltre il limite del proxy/server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Upload fallito
                details:
                  - field: foto
                    message: File too large
        '415':
          description: |
            MIME type non supportato. Ammessi: `image/jpeg`, `image/png`, `image/webp`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Upload fallito
                details:
                  - field: foto
                    message: 'MIME type "application/pdf" non ammesso'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT ottenuto da `POST /auth/login` o `POST /auth/register/*`.
  schemas:

    LoginRequest:
      type: object
      description: Payload per il login.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345

    LoginResponse:
      type: object
      description: Risposta login.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Login effettuato con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserPublic'

    RegisterCitizenRequest:
      type: object
      description: Payload registrazione cittadino.
      required:
        - email
        - password
        - nome
        - cognome
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecurePassword12345
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi

    RegisterOwnerRequest:
      type: object
      description: Payload registrazione proprietario.
      required:
        - email
        - password
        - nome
        - cognome
        - partitaIVA
      properties:
        email:
          type: string
          format: email
          example: proprietario@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: SecurePassword12345
        nome:
          type: string
          example: Luigi
        cognome:
          type: string
          example: Bianchi
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'

    RegisterResponse:
      type: object
      description: Risposta registrazione.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Registrazione avvenuta con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      description: Rappresentazione pubblica utente.
      required:
        - _id
        - email
        - nome
        - cognome
        - ruolo
        - createdAt
      properties:
        _id:
          type: string
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        email:
          type: string
          format: email
        nome:
          type: string
        cognome:
          type: string
        ruolo:
          type: string
          enum: [cittadino, proprietario, operatore]
        profiloDisabilita:
          type: array
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle, cecita]
        scoreAffidabilita:
          type: number
          minimum: 0
          example: 0
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      description: |
        Payload per l'aggiornamento parziale del profilo (semantica PATCH).
        Tutti i campi sono opzionali, ma il body deve contenere almeno
        un campo modificabile presente nella whitelist.
      properties:
        profiloDisabilita:
          type: array
          description: |
            Array delle disabilità. Sovrascrive completamente il valore esistente.
            Riservato al ruolo `cittadino`.
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle]

    UpdateProfileResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Profilo aggiornato con successo
        user:
          $ref: '#/components/schemas/UserPublic'

    CategoriaBarriera:
      type: string
      description: Categoria della barriera architettonica o ostacolo segnalato.
      enum:
        - marciapiede_rotto
        - ostacolo_temporaneo
        - auto_sosta_vietata
        - scalino_non_segnalato
        - pavimentazione_dissestata
        - mancanza_rampa
        - semaforo_non_accessibile
        - altro

    StatoSegnalazione:
      type: string
      description: |
        Stato del ciclo di vita della segnalazione.
        Per `SegnalazionePubblica` lo stato `IN_VERIFICA` è proibito
        (vincolo OCL Deliverable 2, §3.3).
      enum:
        - APERTA
        - IN_VERIFICA
        - PRESA_IN_CARICO
        - RISOLTA
        - ARCHIVIATA

    GeoJSONPoint:
      type: object
      description: |
        Oggetto geografico in formato **GeoJSON Point** (RFC 7946).
        Usato per indicizzazione spaziale MongoDB tramite indice `2dsphere`.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
          example: Point
        coordinates:
          type: array
          description: |
            Array di 2 numeri nell'ordine `[longitudine, latitudine]`.
            Range: longitudine ∈ [-180, 180], latitudine ∈ [-90, 90].
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [11.1217, 46.0700]

    CreateSegnalazionePubblicaForm:
      type: object
      description: |
        Payload `multipart/form-data` per la creazione di una segnalazione
        pubblica. La geolocalizzazione è espressa come due campi piatti
        (`longitudine`, `latitudine`) ricomposti server-side in `GeoJSONPoint`.
      required:
        - descrizione
        - categoria
        - longitudine
        - latitudine
      properties:
        descrizione:
          type: string
          minLength: 10
          maxLength: 1000
          description: Descrizione testuale della barriera.
          example: Marciapiede dissestato in prossimità delle strisce pedonali.
        categoria:
          $ref: '#/components/schemas/CategoriaBarriera'
        longitudine:
          type: string
          description: |
            Longitudine GPS (valore numerico trasmesso come stringa per
            limite di `multipart/form-data`). Range [-180, 180].
          example: '11.1217'
        latitudine:
          type: string
          description: |
            Latitudine GPS (valore numerico trasmesso come stringa per
            limite di `multipart/form-data`). Range [-90, 90].
          example: '46.0700'
        foto:
          type: array
          description: |
            Array di file immagine. Massimo 5 file, ciascuno ≤ 5MB.
            MIME ammessi: `image/jpeg`, `image/png`, `image/webp`.
            Campo opzionale: una segnalazione può essere creata senza foto.
          maxItems: 5
          items:
            type: string
            format: binary

    SegnalazionePubblica:
      type: object
      description: |
        Rappresentazione completa di una segnalazione su suolo pubblico
        (discriminator `tipo = "pubblica"` della collezione `segnalazioni`).
      required:
        - _id
        - tipo
        - descrizione
        - categoria
        - stato
        - geolocalizzazione
        - foto
        - autore
        - bloccaModifica
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          example: 65b4f4e7b8d9c1f4a2e5b6d1
        tipo:
          type: string
          enum: [pubblica]
          description: Discriminator key. Sempre `pubblica` per questo schema.
        descrizione:
          type: string
        categoria:
          $ref: '#/components/schemas/CategoriaBarriera'
        stato:
          $ref: '#/components/schemas/StatoSegnalazione'
        geolocalizzazione:
          $ref: '#/components/schemas/GeoJSONPoint'
        foto:
          type: array
          description: Array di URL relativi delle foto caricate.
          items:
            type: string
            example: /uploads/segnalazioni/1715760000000_a1b2c3d4e5f6.jpg
        autore:
          type: string
          description: ObjectId dell'utente (cittadino) che ha creato la segnalazione.
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        enteCompetente:
          type: string
          nullable: true
          description: |
            ObjectId dell'operatore comunale assegnato. `null` finché non
            avviene l'assegnazione.
          example: null
        bloccaModifica:
          type: boolean
          description: |
            Se `true`, la segnalazione è in stato terminale e non
            modificabile (es. RISOLTA, ARCHIVIATA).
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSegnalazioneResponse:
      type: object
      description: Risposta alla creazione di una segnalazione.
      required:
        - message
        - segnalazione
      properties:
        message:
          type: string
          example: Segnalazione creata con successo
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePubblica'

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string

    ValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Validazione fallita
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
