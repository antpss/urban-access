openapi: 3.0.3

info:
  title: UrbanAccess API
  description: |
    REST API per il sistema **UrbanAccess**, una piattaforma di mappatura crowdsourcing
    dell'accessibilità urbana.

    ## Convenzioni
    - Tutte le risposte sono in formato JSON.
    - Architettura RESTful e stateless.
    - Password encryption via bcrypt.
    - Autenticazione tramite JWT.

    ## Modello utenti
    Il sistema distingue tre ruoli principali: `cittadino`, `proprietario` e `operatore`.

    ## Architettura registrazione
    La registrazione è segmentata per ruolo tramite endpoint dedicati:
    - `POST /auth/register/citizen` — registrazione cittadini
    - `POST /auth/register/owner` — registrazione proprietari
    - **Operatori comunali**: NON registrabili via API pubblica.
      Creati esclusivamente tramite seed script o shell Mongoose dall'amministratore.

    Il payload di registrazione è **minimale** per i cittadini (solo identità).
    I proprietari aggiungono `partitaIVA` poiché sono dati legalmente
    necessari per identificare un'attività commerciale.

    ## Gestione del profilo utente
    Dopo la registrazione, il profilo dell'utente può essere modificato parzialmente tramite `PATCH /users/me`.
    L'endopoint segue il pattern PATCH parziale: il body contiene solo i campi da modificare. I campi modificabili sono
    gestiti server-side tramite una whitelist con vincoli per ogni campo (ruolo, validazione, trasformazione).

    Attualmente i campi modificabili sono `nome` e `cognome` (per tutti i ruoli) e `profiloDisabilita` (riservato ai cittadini).

    ## Asset statici (foto segnalazioni)
    Le foto caricate dai cittadini in `POST /publicReports` e `POST /privateReports` vengono
    salvate su disco e servite come asset statici da `GET /uploads/reports/{filename}`.
    Tali URL **NON** sono parte dell'API REST documentata: sono risorse pubbliche
    raggiungibili direttamente.

    ## Routing e geocoding
    Il sistema offre due funzionalità di supporto alla navigazione accessibile,
    raggruppate sotto il tag `Routing`:

    - `GET /geocode` — traduce un indirizzo testuale in coordinate geografiche,
      appoggiandosi al servizio **Nominatim** di OpenStreetMap. Restituisce una
      lista di candidati, lasciando al client la disambiguazione.
    - `GET /routes` — calcola un percorso pedonale verso una destinazione tramite
      il servizio di routing pubblico **OpenRouteService** (profilo `foot-walking`),
      restituendo la geometria come GeoJSON LineString.

    Entrambi gli endpoint sono di **sola lettura, idempotenti e stateless**:
    nessun percorso o ricerca viene persistito. Un percorso è infatti un dato
    derivato e deperibile, funzione dello stato corrente della rete di
    accessibilità; viene quindi sempre ricalcolato e mai salvato.

    Nella fase attuale l'origine del percorso è **hardcoded al centro di Trento**
    e non rilevata dalla geolocalizzazione reale dell'utente.

    ### Semantica degli errori di routing
    Il sistema distingue due situazioni che un'integrazione ingenua confonderebbe:
    - **`422 Unprocessable Entity`** — la destinazione è valida ma non raggiungibile
      a piedi (punto isolato dalla rete, fuori area, oltre la distanza massima
      pedonale). Non è un guasto: semplicemente nessun percorso esiste.
    - **`502 Bad Gateway`** — il servizio esterno (OpenRouteService o Nominatim) è
      irraggiungibile o malfunzionante. Guasto reale del servizio a monte.

    Questa distinzione consente al client di reagire correttamente: suggerire
    un'altra destinazione nel primo caso, riprovare più tardi nel secondo.

  version: 1.0.0
  contact:
    name: Gruppo 17 - UrbanAccess - Andrea Boarini, Antonio Possemato, Giovanni Todesco
    email: decideremaildicontatto@gmail.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Server di sviluppo locale

tags:
  - name: Authentication
    description: Endpoint per registrazione e accesso degli utenti
  - name: Users
    description: Gestione del profilo utente autenticato
  - name: Segnalazioni
    description: |
      Gestione delle segnalazioni di barriere architettoniche e ostacoli.
      Le segnalazioni si dividono in **pubbliche** (suolo pubblico, immediatamente
      visibili) e **private** (strutture private, soggette a validazione crowdsourcing).
  - name: Strutture
    description: | 
      Gestione delle strutture private (attività commerciali) registrate
      dai proprietari. Le strutture sono il "target" delle segnalazioni private.
  - name: Routing
    description: |
      Calcolo di percorsi pedonali accessibili e geocoding di indirizzi.
      Il geocoding traduce testo libero in coordinate (Nominatim/OpenStreetMap);
      il routing calcola il tragitto a piedi tramite il servizio pubblico OpenRouteService.
      Entrambi sono operazioni di sola lettura e stateless: nessun dato viene
      persistito a seguito di queste chiamate.
  - name: Admin
    description: |
      Endpoint riservati agli operatori del Comune (ruolo `operatore`).
      Funzioni di backoffice e analisi aggregata sul territorio. Non
      accessibili a cittadini o proprietari.

paths:

  /auth/register/citizen:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo cittadino
      description: |
        Crea un nuovo account di tipo `cittadino` nel sistema.

        **Payload minimale**: solo dati anagrafici e credenziali.
        I dati di profilazione (profilo disabilità, ecc.) sono gestiti
        tramite endpoint dedicati post-registrazione.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - Lo `scoreAffidabilita` viene inizializzato a `5` (score neutrale per evitare penalizzazione iniziale).
        - `profiloDisabilita` ha default `[]` ovvero un array vuoto.
        - `storicoPercorsi` e `storicoSegnalazioni` inizializzati come array vuoti.
      operationId: registraCittadino
      requestBody:
        required: true
        description: Dati anagrafici e credenziali del nuovo cittadino.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
              nome: Mario
              cognome: Rossi
      responses:
        '201':
          description: Cittadino registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_citizen
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: []
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/register/owner:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo proprietario di struttura
      description: |
        Crea un nuovo account di tipo `proprietario` nel sistema.

        **Differenze rispetto al cittadino:**
        - Richiede `partitaIVA` (11 cifre, identificatore fiscale italiano).

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - `partitaIVA` deve essere univoca nel sistema.
        - `strutture` inizializzato come array vuoto.
      operationId: registraProprietario
      requestBody:
        required: true
        description: Dati anagrafici, credenziali e dati commerciali del proprietario.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              email: proprietario@example.com
              password: SecurePassword12345
              nome: Luigi
              cognome: Bianchi
              partitaIVA: '12345678901'
      responses:
        '201':
          description: Proprietario registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_owner
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c8
                  email: proprietario@example.com
                  nome: Luigi
                  cognome: Bianchi
                  ruolo: proprietario
                  partitaIVA: '12345678901'
                  createdAt: '2026-05-12T14:35:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: |
            Conflitto su campo univoco. Si verifica quando l'email o la
            partitaIVA sono già registrate nel sistema. Il campo in conflitto
            è specificato nel messaggio di errore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login utente
      description: |
        Autentica un utente esistente (cittadino o proprietario) tramite
        email e password, restituendo un **token JWT** da usare nelle richieste successive.

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima della ricerca.
        - La password viene confrontata con l'hash bcrypt salvato in DB.
        - In caso di successo viene generato un token JWT firmato con `JWT_SECRET`,
          contenente `userId`, `ruolo` e scadenza a **2 ore**.
        - Il token deve essere incluso nell'header `Authorization: Bearer <token>`
          per accedere agli endpoint protetti.

        **Sicurezza:**
        - In caso di email non trovata o password errata viene restituito sempre
          `401 Unauthorized` con messaggio generico, senza specificare quale
          dei due campi è errato (prevenzione user enumeration).
      operationId: loginUtente
      requestBody:
        required: true
        description: Credenziali di accesso.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
      responses:
        '200':
          description: Login effettuato con successo. Restituisce il token JWT e i dati pubblici dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                message: Login effettuato con successo
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2NWEzZjRlN2I4ZDljMWY0YTJlNWI2YzciLCJydW9sbyI6ImNpdHRhZGlubyIsImlhdCI6MTc0NzA1NjIwMCwiZXhwIjoxNzQ3MTQyNjAwfQ.example
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: []
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Credenziali non valide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Credenziali non valide
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /users/me:
    get:
      tags:
        - Users
      summary: Recupera il profilo dell'utente autenticato
      description: |
        Restituisce la rappresentazione completa del profilo dell'utente identificato dal JWT.

        **Comportamento server-side:**
        - L'`userId` viene estratto dal JWT.
        - La query viene eseguita sul modello base `User`: il documento ritornato include
          automaticamente i campi del subschema corrispondente al ruolo (`cittadino`,
          `proprietario`, `operatore`) grazie al meccanismo dei discriminator di Mongoose.
        - I campi sensibili (`password`) o interni (`__v`, `notifiche`) sono esclusi dalla risposta.

        **Verifica sul token:**
        - Token mancante, malformato o scaduto produce Errore 401.
        - Token valido ma utente inesistente (es. eliminato) produce Errore 404.
      operationId: getProfiloUtente
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profilo recuperato con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfileResponse'
              examples:
                cittadino:
                  summary: Profilo di un cittadino
                  value:
                    user:
                      _id: 65a3f4e7b8d9c1f4a2e5b6c7
                      email: mario.rossi@example.com
                      nome: Mario
                      cognome: Rossi
                      ruolo: cittadino
                      profiloDisabilita: [sediaARotelle]
                      scoreAffidabilita: 5
                      createdAt: '2026-05-12T14:30:00.000Z'
                proprietario:
                  summary: Profilo di un proprietario
                  value:
                    user:
                      _id: 65a3f4e7b8d9c1f4a2e5b6c8
                      email: proprietario@example.com
                      nome: Luigi
                      cognome: Bianchi
                      ruolo: proprietario
                      partitaIVA: '12345678901'
                      createdAt: '2026-05-12T14:35:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Utente non trovato. Il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Users
      summary: Aggiorna il profilo dell'utente autenticato
      description: |
        Aggiorna parzialmente il profilo dell'utente identificato dal JWT.

        **Semantica PATCH:**
        Il payload descrive i campi da modificare. Ciò che non è specificato nel body resta invariato.
        Se viene specificato un campo, il suo valore sovrascrive completamente quello esistente.

        **Campi modificabili da whitelist:**
        - `nome`, `cognome`: Modificabili da tutti i ruoli (`cittadino`, `proprietario`, `operatore`).
        - `profiloDisabilita`: Riservato esclusivamente al ruolo `cittadino`. I valori accettati sono: `sediaARotelle`, `cecita`, `sordita`, `ausilioDeambulazione`.

        **Comportamento server-side:**
        - L'`userId` viene estratto dal JWT.
        - I valori duplicati nell'array `profiloDisabilita` vengono deduplicati lato server.
        - Valori non ammessi nell'enum producono Errore 400.
        - Campi non presenti nella whitelist dei modificabili vengono ignorati.
        - Body vuoto (nessun campo modificabile presente) produce Errore 400.

        **Verifica sul token:**
        - Se il token non è valido o scaduto produce Errore 401.
        - Se il token è valido ma l'utente non esiste più (es. eliminato) produce Errore 404.
        - Se il token passato appartiene a un utente con un ruolo diverso da `cittadino` e si tenta di modificare `profiloDisabilita`, produce Errore 403 segnalando l'impossibilità di modificare i campi non esistenti come attributi per quel ruolo. Questo garantisce che solo chi possiede un dato attributo possa modificarlo.
      operationId: aggiornaProfiloUtente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nome: Mario Pasquale
              cognome: Rossi
              profiloDisabilita: [sediaARotelle, cecita]
      responses:
        '200':
          description: Profilo aggiornato con successo. Ritorna la rappresentazione completa dell'utente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfileResponse'
              example:
                message: Profilo aggiornato con successo
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario Pasquale
                  cognome: Rossi
                  ruolo: cittadino
                  profiloDisabilita: [sediaARotelle, cecita]
                  scoreAffidabilita: 5
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            Autenticazione fallita. Possibili cause:
            - token mancante nell'header `Authorization`
            - token non valido (firma errata, formato errato, ecc.)
            - token scaduto (oltre 2 ore dalla generazione)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenMancante:
                  value:
                    error: Token mancante
                tokenScaduto:
                  value:
                    error: Token scaduto
                tokenNonValido:
                  value:
                    error: Token non valido
        '403':
          description: |
            Ruolo autenticato ma non autorizzato.
            Si verifica quando si tenta di modificare un campo riservato a un ruolo diverso dal proprio
            (es. un `proprietario` che tenta di modificare `profiloDisabilita` riservato ai `cittadino`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Modifica del campo "profiloDisabilita" non permessa per il ruolo "proprietario"
        '404':
          description: Utente non trovato. Si verifica quando il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server
    delete:
      tags:
          - Users
      summary: Cancella definitivamente l'account dell'utente autenticato
      description: |
        Elimina in modo **permanente e irreversibile** l'account dell'utente identificato
        dal JWT, insieme ai dati personali associati. Implementa il diritto all'oblio
        previsto dall'art. 17 del GDPR.

        **Re-autenticazione obbligatoria:**
        Trattandosi di un'operazione distruttiva, il body deve contenere la `password`
        corrente dell'utente. La password viene verificata contro l'hash bcrypt salvato.
        Questa è una semplice re-autenticazione nella singola richiesta: **non** crea né
        consuma stato server-side, coerentemente con l'architettura stateless.

        **Cancellazione a cascata (server-side):**
        L'eliminazione tocca dati eterogenei a seconda del ruolo. L'ordine è studiato per
        eliminare i dati satellite **prima** dello `User`: in assenza di transazioni, un
        eventuale errore a metà processo lascia l'utente ancora presente e l'operazione
        ripetibile, evitando dati orfani senza possibilità di re-trigger.

        - **Segnalazioni pubbliche** di cui l'utente è autore: **anonimizzate**
          (`autore` impostato a `null`). Il dato di pubblica utilità (es. marciapiede rotto
          su suolo pubblico) viene preservato perché privo di valenza personale una volta
          rimosso il riferimento all'autore; il diritto all'oblio cede di fronte
          all'interesse collettivo.
        - **Segnalazioni private** di cui l'utente è autore: eliminate.
        - **Voti di validazione** dell'utente: l'`userId` viene rimosso da tutte le
          `listaValidatori` in cui compare.
        - Se l'utente è **proprietario**: le sue strutture vengono eliminate, e con esse
          le segnalazioni private a esse associate.
        - Infine lo `User` stesso viene eliminato.

        **Nota sullo stato del token:**
        Essendo l'autenticazione stateless, il JWT già emesso resta crittograficamente
        valido fino alla scadenza naturale. Tuttavia ogni rotta protetta fallisce al primo
        accesso al DB (utente inesistente → 404), quindi il token diventa di fatto inerte.

        **Verifica sul token:**
        - Token mancante, malformato o scaduto produce Errore 401.
        - Password assente nel body produce Errore 400.
        - Password errata produce Errore 401 (fallimento di autenticazione).
        - Token valido ma utente inesistente produce Errore 404.
      operationId: cancellaProfiloUtente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Password corrente dell'utente, per conferma dell'operazione distruttiva.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              password: SecurePassword12345
      responses:
        '200':
          description: Account eliminato con successo insieme a tutti i dati associati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
              example:
                message: Account eliminato con successo
        '400':
          description: Password mancante nel body della richiesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: password
                    message: campo password obbligatorio
        '401':
          description: |
            Autenticazione fallita. Possibili cause:
            - token mancante, non valido o scaduto
            - password fornita errata (re-autenticazione non superata)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tokenMancante:
                  value:
                    error: Token mancante
                tokenScaduto:
                  value:
                    error: Token scaduto
                passwordErrata:
                  value:
                    error: Credenziali non valide
        '404':
          description: Utente non trovato. Il token è valido ma l'utente associato è stato eliminato o non esiste più.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Utente non trovato
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /publicReports:
    post:
      summary: Crea una nuova segnalazione pubblica
      description: |
        Crea una segnalazione su suolo pubblico. Solo i cittadini autenticati possono effettuare questa operazione.
        Il body è `multipart/form-data` per permettere l'upload di foto allegate.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [descrizione, categoria, longitudine, latitudine]
              properties:
                descrizione:
                  type: string
                  minLength: 10
                  maxLength: 1000
                categoria:
                  type: string
                  enum:
                    - marciapiede_rotto
                    - ostacolo_temporaneo
                    - auto_sosta_vietata
                    - scalino_non_segnalato
                    - pavimentazione_dissestata
