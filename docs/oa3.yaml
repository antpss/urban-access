openapi: 3.0.3

info:
  title: UrbanAccess API
  description: |
    REST API per il sistema **UrbanAccess**, una piattaforma di mappatura crowdsourcing
    dell'accessibilità urbana.

    ## Convenzioni
    - Tutte le risposte sono in formato JSON.
    - Architettura RESTful e stateless.
    - Password encryption via bcrypt.
    - Autenticazione tramite JWT (introdotta da US2).

    ## Modello utenti
    Il sistema distingue tre ruoli principali: `cittadino`, `proprietario` e `operatore`.

    ## Architettura registrazione
    La registrazione è segmentata per ruolo tramite endpoint dedicati:
    - `POST /auth/register/citizen` — registrazione cittadini (Sprint 1)
    - `POST /auth/register/owner` — registrazione proprietari (contratto definito, implementazione Sprint 2)
    - **Operatori comunali**: NON registrabili via API pubblica.
      Creati esclusivamente tramite seed script o shell Mongoose dall'amministratore.

    Il payload di registrazione è **minimale** per i cittadini (solo identità).
    I proprietari aggiungono `partitaIVA` poiché sono dati legalmente
    necessari per identificare un'attività commerciale.

  version: 1.0.0
  contact:
    name: Gruppo 17 - UrbanAccess - Andrea Boarini, Antonio Possemato, Giovanni Todesco
    email: decideremaildicontatto@gmail.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api/v1
    description: Server di sviluppo locale

tags:
  - name: Authentication
    description: Endpoint per registrazione e accesso degli utenti

paths:

  /auth/register/citizen:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo cittadino
      description: |
        Crea un nuovo account di tipo `cittadino` nel sistema.

        **Payload minimale**: solo dati anagrafici e credenziali.
        I dati di profilazione (profilo disabilità, ecc.) sono gestiti
        tramite endpoint dedicati post-registrazione (US3).

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - Lo `scoreAffidabilita` viene inizializzato a `0`.
        - `profiloDisabilita` ha default `nessuna` (modificabile via US3).
        - `storicoPercorsi` e `storicoSegnalazioni` inizializzati come array vuoti.
      operationId: registraCittadino
      requestBody:
        required: true
        description: Dati anagrafici e credenziali del nuovo cittadino.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequest'
            example:
              email: mario.rossi@example.com
              password: SecurePassword12345
              nome: Mario
              cognome: Rossi
      responses:
        '201':
          description: Cittadino registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c7
                  email: mario.rossi@example.com
                  nome: Mario
                  cognome: Rossi
                  ruolo: cittadino
                  createdAt: '2026-05-12T14:30:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (email, password, nome, cognome)
            - formato email non valido
            - password troppo corta (< 8 caratteri) o troppo lunga (> 128 caratteri)

            In questo caso possiamo vedere come l'utente ha inserito la mail con formato non valido e la password di lunghezza troppo corta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: email
                    message: Formato email non valido
                  - field: password
                    message: Password minimo 8 caratteri
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

  /auth/register/owner:
    post:
      tags:
        - Authentication
      summary: Registra un nuovo proprietario di struttura
      description: |
        Crea un nuovo account di tipo `proprietario` nel sistema.

        **Differenze rispetto al cittadino:**
        - Richiede `partitaIVA` (11 cifre, identificatore fiscale italiano).

        **Comportamento server-side:**
        - L'email viene normalizzata (lowercase, trim) prima del salvataggio.
        - La password viene salvata in formato hashato (bcrypt, 12 salt rounds).
        - `partitaIVA` deve essere univoca nel sistema.
        - `strutture` inizializzato come array vuoto.
      operationId: registraProprietario
      requestBody:
        required: true
        description: Dati anagrafici, credenziali e dati commerciali del proprietario.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              email: proprietario@example.com
              password: SecurePassword12345
              nome: Luigi
              cognome: Bianchi
              partitaIVA: '12345678901'
      responses:
        '201':
          description: Proprietario registrato con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/users/65a3f4e7b8d9c1f4a2e5b6c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                message: Registrazione avvenuta con successo
                user:
                  _id: 65a3f4e7b8d9c1f4a2e5b6c8
                  email: proprietario@example.com
                  nome: Luigi
                  cognome: Bianchi
                  ruolo: proprietario
                  createdAt: '2026-05-12T14:35:00.000Z'
        '400':
          description: |
            Dati di input non validi. Possibili cause:
            - campo obbligatorio mancante (email, password, nome, cognome, partitaIVA)
            - formato email non valido
            - password troppo corta (< 8 caratteri) o troppo lunga (> 128 caratteri)
            - formato partitaIVA non valido (deve essere esattamente 11 cifre numeriche)

            In questo caso possiamo vedere come l'utente ha inserito la mail con formato non valido e la password di lunghezza troppo corta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: email
                    message: Formato email non valido
                  - field: password
                    message: Password minimo 8 caratteri
        '409':
          description: Email già registrata nel sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Email già registrata
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

components:
  schemas:

    RegisterCitizenRequest:
      type: object
      description: Payload per la registrazione di un nuovo cittadino.
      required:
        - email
        - password
        - nome
        - cognome
      properties:
        email:
          type: string
          format: email
          description: Email univoca. Verrà normalizzata in lowercase e trim.
          maxLength: 254
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          description: Password in chiaro. Verrà salvata in formato hashato lato server.
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          minLength: 1
          maxLength: 50
          example: Mario
        cognome:
          type: string
          minLength: 1
          maxLength: 50
          example: Rossi

    RegisterOwnerRequest:
      type: object
      description: |
        Payload per la registrazione di un nuovo proprietario di struttura.
        Estende il payload del cittadino con `partitaIVA`.
      required:
        - email
        - password
        - nome
        - cognome
        - partitaIVA
      properties:
        email:
          type: string
          format: email
          description: Email univoca. Verrà normalizzata in lowercase e trim.
          maxLength: 254
          example: proprietario@example.com
        password:
          type: string
          format: password
          description: Password in chiaro. Verrà salvata in formato hashato lato server.
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          minLength: 1
          maxLength: 50
          example: Luigi
        cognome:
          type: string
          minLength: 1
          maxLength: 50
          example: Bianchi
        partitaIVA:
          type: string
          description: Partita IVA italiana, esattamente 11 cifre numeriche.
          pattern: '^\d{11}$'
          example: '12345678901'

    RegisterResponse:
      type: object
      description: Risposta in caso di registrazione avvenuta con successo.
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Registrazione avvenuta con successo
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      description: |
        Rappresentazione pubblica minimale di un utente appena registrato.
        Non contiene mai la password.
        Per recuperare il profilo completo (con dati specifici del ruolo) usare `GET /users/me`.
      properties:
        _id:
          type: string
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        email:
          type: string
          format: email
        nome:
          type: string
        cognome:
          type: string
        ruolo:
          type: string
          enum: [cittadino, proprietario]
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Messaggio di errore.
        message:
          type: string
          description: Dettaglio aggiuntivo (opzionale).

    ValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Validazione fallita
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string