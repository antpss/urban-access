  /privateReports:
    post:
      summary: Crea una nuova segnalazione privata su una struttura
      description: |
        Crea una segnalazione relativa a una struttura privata. Solo i cittadini autenticati possono effettuare questa operazione.
        Lo `scoreAssociato` iniziale è `1 + scoreAffidabilita dell'autore`: se raggiunge
        già la soglia di validazione la segnalazione nasce `APERTA` (autore affidabile),
        altrimenti nasce `IN_VERIFICA`. In entrambi i casi è visibile sulla mappa: lo
        `stato` distingue una segnalazione confermata da una ancora in verifica.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [descrizione, categoria, longitudine, latitudine, strutturaAssociata]
              properties:
                descrizione:
                  type: string
                  minLength: 10
                  maxLength: 1000
                categoria:
                  type: string
                  enum:
                    - mancanza_rampa
                    - bagno_non_accessibile
                    - ascensore_guasto
                    - spazi_interni_stretti
                    - altro
                longitudine:
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                latitudine:
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                strutturaAssociata:
                  type: string
                  pattern: '^[a-f0-9]{24}$'
                  description: ObjectId MongoDB della struttura privata
                foto:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Segnalazione creata e in attesa di validazione
          headers:
            Location:
              description: URI della risorsa creata
              schema:
                type: string
                example: /api/v1/privateReports/65b1a2c3d4e5f6a7b8c9d0e1
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  segnalazione:
                    $ref: '#/components/schemas/SegnalazionePrivata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Struttura associata non trovata

    get:
      summary: Recupera segnalazioni private con filtri opzionali
      description: |
        Restituisce l'elenco delle segnalazioni private. Per i ruoli non-operatore
        vengono restituite le segnalazioni in stati "vivi" — `IN_VERIFICA` (validabili)
        e `APERTA` (validate) — così i cittadini possono vederle e votarle; sono escluse
        `RISOLTA` e `ARCHIVIATA`. Gli operatori vedono tutti gli stati per moderazione.
        Se la query passa un `stato` esplicito, quello ha precedenza.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      parameters:
        - name: bbox
          in: query
          required: false
          description: 'Bounding box geografica, formato: minLng,minLat,maxLng,maxLat'
          schema:
            type: string
          example: "11.10,46.05,11.15,46.10"
        - name: stato
          in: query
          required: false
          schema:
            type: string
            enum: [APERTA, IN_VERIFICA, PRESA_IN_CARICO, RISOLTA, ARCHIVIATA]
        - name: categoria
          in: query
          required: false
          schema:
            type: string
            enum:
              - mancanza_rampa
              - bagno_non_accessibile
              - ascensore_guasto
              - spazi_interni_stretti
              - altro
        - name: strutturaAssociata
          in: query
          required: false
          description: Filtra le segnalazioni private per la struttura associata (ObjectId).
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: "65b4f4e7b8d9c1f4a2e5b6a9"
        - name: proprietario
          in: query
          required: false
          description: |
            Filtra le segnalazioni private su tutte le strutture del proprietario
            indicato (ObjectId). Autorizzato solo se coincide con l'utente
            autenticato (`403` altrimenti). In questo caso vengono restituiti
            tutti gli stati, incluse le `RISOLTA` (dashboard proprietario, US17).
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: "65a3f4e7b8d9c1f4a2e5b6c7"

      responses:
        '200':
          description: Lista segnalazioni private filtrate
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  segnalazioni:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegnalazionePrivata'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /privateReports/{id}/validations:
    post:
      summary: Conferma (valida) una segnalazione privata
      description: |
        Un cittadino autenticato conferma una segnalazione privata.
        Conferma unica per coppia (cittadino, segnalazione). Non si può validare
        una propria segnalazione. Ogni conferma somma lo scoreAffidabilita del
        votante a scoreAssociato; raggiunta la soglia (default 10) la segnalazione
        passa IN_VERIFICA -> APERTA e 10 punti vengono ripartiti floor(10/N) tra i
        validatori (cap 14). Voto su segnalazione già APERTA: registrato, nessun punto.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della segnalazione privata da validare
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b1a2c3d4e5f6a7b8c9d0e1
      responses:
        '201':
          description: Voto registrato (soglia raggiunta o non ancora raggiunta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '200':
          description: Voto su segnalazione già validata (nessun punteggio assegnato)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  statoSegnalazione: { type: string, example: APERTA }
                  scoreAssociato: { type: number }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ruolo non cittadino oppure tentativo di validare una propria segnalazione
        '404':
          description: Segnalazione privata non trovata
        '409':
          description: Già validata da questo utente, o segnalazione non validabile nello stato corrente
  /privateReports/{id}/disputes:
    post:
      summary: Smentisci una segnalazione privata
      description: |
        US27 — Un cittadino autenticato smentisce una segnalazione privata.
        Voto unico per coppia (cittadino, segnalazione): un utente non può sia
        confermare sia smentire la stessa segnalazione. Non si può smentire una
        propria segnalazione né una in stato terminale (RISOLTA, ARCHIVIATA,
        PRESA_IN_CARICO) o bloccata.

        La smentita sottrae lo scoreAffidabilita del votante allo scoreAssociato
        della segnalazione. Se lo score scende a 0 o meno la segnalazione diventa
        ARCHIVIATA (terminale) e l'autore subisce una penalità pari a
        ceil(scoreAffidabilita_autore / 2) (clamp a 1), applicata una sola volta.
        Una APERTA smentita sotto soglia retrocede a IN_VERIFICA; i punti già
        distribuiti ai validatori restano. Smentire non assegna punti.
      tags:
        - Segnalazioni
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della segnalazione privata da smentire
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b1a2c3d4e5f6a7b8c9d0e1
      responses:
        '201':
          description: Smentita registrata (eventualmente con archiviazione)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Ruolo non cittadino oppure tentativo di smentire una propria segnalazione
        '404':
          description: Segnalazione privata non trovata
        '409':
          description: Già votata da questo utente, o segnalazione non smentibile nello stato corrente
  /privateReports/{id}/stato:
    patch:
      tags:
        - Segnalazioni
      summary: Chiude (risolve) una segnalazione privata sulla propria struttura
      operationId: aggiornaStatoSegnalazionePrivata
      description: |
        Permette a un `proprietario` di contrassegnare come `RISOLTA` una
        segnalazione privata relativa a una **propria** struttura (US17).
        Tipicamente l'intervento è stato eseguito (es. installata la rampa) e
        il proprietario chiude la segnalazione.

        **Transizione di stato consentita:** unicamente da `IN_VERIFICA` o
        `APERTA` verso `RISOLTA`. Per ora `RISOLTA` è l'unico valore accettato
        nel body; qualunque altro valore produce `400`.

        **Effetti collaterali server-side:** una volta `RISOLTA`, la
        segnalazione esce dalla mappa (`visibile = false`) e viene bloccata in
        scrittura (`bloccaModifica = true`), impedendo ulteriori validazioni
        crowdsourcing. Questi campi sono derivati: il client non li invia.

        **Scope e autorizzazione:** opera solo su segnalazioni di tipo
        `privata`. Un `id` che punta a una pubblica produce `404`. Oltre al
        ruolo `proprietario`, è verificata l'**ownership**: il proprietario
        autenticato deve possedere la struttura associata alla segnalazione,
        altrimenti `403` (anti-IDOR, identità letta dal JWT).

        **Conflitto di stato:** una segnalazione già `RISOLTA`, `PRESA_IN_CARICO`
        o `ARCHIVIATA` non è richiudibile e produce `409`.

        **Semantica PATCH:** modifica parziale della risorsa esistente (cambia
        `stato` e i campi derivati). Non idempotente per dominio: la seconda
        chiamata fallisce con `409` perché lo stato non è più chiudibile.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della segnalazione privata da chiudere.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b1a2c3d4e5f6a7b8c9d0e1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stato]
              properties:
                stato:
                  type: string
                  enum: [RISOLTA]
                  description: Stato di destinazione. Unico valore ammesso al momento.
            example:
              stato: RISOLTA
      responses:
        '200':
          description: Segnalazione contrassegnata come risolta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  segnalazione:
                    $ref: '#/components/schemas/SegnalazionePrivata'
              example:
                message: Segnalazione contrassegnata come risolta
                segnalazione:
                  _id: 65b1a2c3d4e5f6a7b8c9d0e1
                  tipo: privata
                  descrizione: Ingresso con gradino non superabile in carrozzina
                  categoria: mancanza_rampa
                  stato: RISOLTA
                  strutturaAssociata: 65b4f4e7b8d9c1f4a2e5b6a9
                  visibile: false
                  bloccaModifica: true
                  autore: 65a3f4e7b8d9c1f4a2e5b6c7
                  createdAt: '2026-05-15T09:20:00.000Z'
                  updatedAt: '2026-05-22T16:45:00.000Z'
        '400':
          description: |
            `id` non valido, oppure `stato` assente o diverso da `RISOLTA`
            (transizione non ammessa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: stato
                    message: 'transizione non ammessa: ammesso solo "RISOLTA"'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Ruolo non autorizzato (solo `proprietario`) oppure la struttura
            associata non appartiene al proprietario autenticato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Accesso negato. Puoi chiudere solo le segnalazioni sulle tue strutture.
        '404':
          description: |
            Segnalazione privata non trovata (inesistente o di tipo pubblico),
            oppure struttura associata non trovata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Segnalazione privata non trovata
        '409':
          description: |
            Conflitto di stato. La segnalazione esiste ma non è in uno stato
            chiudibile (`IN_VERIFICA` o `APERTA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Transizione non valida: una segnalazione in stato RISOLTA non può essere chiusa.'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /structures:
    post:
      tags:
        - Strutture
      summary: Registra una nuova struttura privata
      description: |
        Permette a un `proprietario` autenticato di registrare una nuova
        attività commerciale, rendendola visibile sulla mappa del sistema
        come potenziale target di segnalazioni private.
 
        ## Geolocalizzazione
        A differenza degli endpoint `/reports/*` (che usano `multipart/form-data`
        e quindi coordinate "piatte"), qui il payload è `application/json` e la
        geolocalizzazione viene inviata come oggetto **GeoJSON `Point`** completo:
        `{ type: "Point", coordinates: [lng, lat] }`. Indice `2dsphere` lato DB.
 
        **Ordine coordinate**: GeoJSON impone `[longitudine, latitudine]`,
        contro-intuitivo rispetto a Google Maps.
 
        ## Comportamento server-side
        - Il `proprietario` viene impostato dal JWT, non dal client (anti-IDOR).
        - L'`_id` della struttura viene aggiunto a `strutture` del proprietario.
      operationId: registraStruttura
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrutturaRequest'
            example:
              nome: Bar Centrale
              categoria: bar
              indirizzo: Via Belenzani 14, 38122 Trento TN
              geolocalizzazione:
                type: Point
                coordinates: [11.1217, 46.0667]
      responses:
        '201':
          description: Struttura registrata con successo.
          headers:
            Location:
              schema:
                type: string
              description: URL della risorsa appena creata.
              example: /api/v1/structures/65b4f4e7b8d9c1f4a2e5b6a9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStrutturaResponse'
              example:
                message: Struttura registrata con successo
                struttura:
                  _id: 65b4f4e7b8d9c1f4a2e5b6a9
                  nome: Bar Centrale
                  categoria: bar
                  indirizzo: Via Belenzani 14, 38122 Trento TN
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0667]
                  proprietario: 65a3f4e7b8d9c1f4a2e5b6c8
                  createdAt: '2026-05-15T10:00:00.000Z'
                  updatedAt: '2026-05-15T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Token mancante, non valido o scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token mancante
        '403':
          description: Ruolo non autorizzato. Solo il ruolo `proprietario` può registrare strutture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Accesso negato: ruolo non autorizzato'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Errore interno del server

    get:
      tags:
        - Strutture
      summary: Lista delle strutture con filtri opzionali
      description: |
        Restituisce l'elenco delle strutture, opzionalmente filtrate per
        bounding box geospaziale, categoria e/o proprietario.
 
        ## Vincoli di autorizzazione su `proprietario`
        Il filtro `proprietario=<id>` è ammesso **solo se l'id coincide con
        quello del JWT** (anti-IDOR/anti-enumeration). Tentativi di filtrare
        per id altrui restituiscono `403`.
 
        ## Visibilità del campo `proprietario` nella risposta
        Il campo `proprietario` viene incluso solo se il chiamante sta
        richiedendo le proprie strutture (`?proprietario=<suo_id>`).
        Altrimenti viene omesso per privacy.
      operationId: listaStrutture
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          required: false
          description: |
            Bounding box geospaziale nel formato `minLng,minLat,maxLng,maxLat`.
            Restituisce solo le strutture la cui geolocalizzazione cade nel rettangolo.
            Sfrutta l'indice 2dsphere.
          example: "11.10,46.05,11.15,46.08"
        - in: query
          name: categoria
          schema:
            type: string
            enum:
              - ristorante
              - bar
              - negozio
              - ufficio
              - hotel
              - studio_medico
              - palestra
              - altro
          required: false
          description: Filtro per categoria. Valori fuori enum → `400`.
        - in: query
          name: proprietario
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          required: false
          description: |
            ObjectId del proprietario. Ammesso solo se coincide con l'id del JWT,
            altrimenti `403`. Quando presente e valido, i risultati includono il
            campo `proprietario` nella risposta.
      responses:
        '200':
          description: Lista delle strutture (può essere vuota).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StruttureListResponse'
              example:
                count: 1
                strutture:
                  - _id: 65b4f4e7b8d9c1f4a2e5b6a9
                    nome: Bar Centrale
                    categoria: bar
                    indirizzo: Via Belenzani 14, 38122 Trento TN
                    geolocalizzazione:
                      type: Point
                      coordinates: [11.1217, 46.0667]
                    proprietario: 65a3f4e7b8d9c1f4a2e5b6c8
                    createdAt: '2026-05-15T10:00:00.000Z'
                    updatedAt: '2026-05-15T10:00:00.000Z'
        '400':
          description: |
            Filtri non validi. Possibili cause:
            - `bbox` mal formato o coordinate fuori range
            - `categoria` fuori enum
            - `proprietario` non è un ObjectId valido (24 hex)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: bbox
                    message: 'formato atteso: minLng,minLat,maxLng,maxLat'
        '401':
          description: Token mancante, non valido o scaduto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tentativo di filtrare per un `proprietario` diverso dal proprio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Accesso negato. Puoi filtrare solo per il tuo id.
        '500':
          description: Errore interno del server.


  /structures/{id}:
    get:
      tags:
        - Strutture
      summary: Recupera una singola struttura per id
      description: |
        Restituisce la rappresentazione completa di una struttura, incluso il
        sottodocumento `accessibilita` e il badge derivato `accessibile`.
 
        Endpoint di sola lettura. Accessibile a qualsiasi utente autenticato:
        i dati di accessibilità di una struttura sono informazione pubblica
        (è il loro scopo — mostrare il badge ai clienti).
 
        **Visibilità del campo `proprietario`:** incluso solo se il chiamante
        è il proprietario della struttura, altrimenti omesso per privacy
        (stessa logica di `GET /structures`).
      operationId: getStrutturaById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della struttura.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b4f4e7b8d9c1f4a2e5b6a9
      responses:
        '200':
          description: Struttura trovata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStrutturaResponse'
              example:
                struttura:
