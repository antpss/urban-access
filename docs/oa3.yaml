  /structures/{id}/accessibility:
    patch:
      tags:
        - Strutture
      summary: Compila/aggiorna l'autocertificazione di accessibilità di una struttura
      description: |
        Permette al **proprietario della struttura** di autocertificare i
        parametri di accessibilità (rampa, ascensore, bagno accessibile, ecc.).
 
        ## Semantica PATCH parziale
        Il body contiene solo i parametri da modificare. I parametri non
        presenti restano invariati. Ogni parametro è un booleano.
 
        ## Badge derivato (NON scrivibile dal client)
        Il campo `accessibile` **non** è accettato nel body: è calcolato
        server-side. Regola corrente: la struttura è `accessibile = true` se
        **almeno 3** parametri di accessibilità risultano `true`. La soglia è
        una decisione di dominio implementata nel modello, non nel client; il
        client riceve sempre il valore autoritativo nella risposta.
 
        ## Autorizzazione (duplice controllo)
        - **Ruolo:** solo `proprietario` (middleware `requireRole`).
        - **Ownership:** l'`id` della struttura deve appartenere al proprietario
          autenticato (`struttura.proprietario === JWT.userId`). Un proprietario
          NON può modificare l'accessibilità di una struttura altrui → `403`.
          Il controllo di solo ruolo non basta: distingue i proprietari dai
          cittadini, ma non un proprietario dall'altro.
 
        ## Comportamento server-side
        - L'`id` viene validato come ObjectId (24 hex) prima della query.
        - Solo i campi presenti nella whitelist di `accessibilita` vengono
          applicati; campi sconosciuti o `accessibile` nel body sono ignorati.
        - Dopo l'applicazione, un hook Mongoose ricalcola `accessibile`.
      operationId: aggiornaAccessibilitaStruttura
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della struttura da aggiornare.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b4f4e7b8d9c1f4a2e5b6a9
      requestBody:
        required: true
        description: |
          Sottoinsieme dei parametri di accessibilità da modificare.
          Deve contenere almeno un campo valido.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessibilityRequest'
            example:
              rampa: true
              bagnoAccessibile: true
              ingressoSenzaGradini: true
      responses:
        '200':
          description: |
            Accessibilità aggiornata. Ritorna la struttura completa con il
            badge `accessibile` ricalcolato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStrutturaResponse'
              example:
                message: Accessibilità aggiornata con successo
                struttura:
                  _id: 65b4f4e7b8d9c1f4a2e5b6a9
                  nome: Bar Centrale
                  categoria: bar
                  indirizzo: Via Belenzani 14, 38122 Trento TN
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0667]
                  accessibilita:
                    rampa: true
                    ascensore: false
                    bagnoAccessibile: true
                    ingressoSenzaGradini: true
                    parcheggioRiservato: false
                  accessibile: true
                  proprietario: 65a3f4e7b8d9c1f4a2e5b6c8
                  createdAt: '2026-05-15T10:00:00.000Z'
                  updatedAt: '2026-05-16T09:00:00.000Z'
        '400':
          description: |
            Input non valido. Possibili cause:
            - `id` non è un ObjectId valido (24 hex)
            - nessun campo di accessibilità valido presente nel body
            - un parametro non è di tipo booleano
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: rampa
                    message: deve essere un valore booleano
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Accesso negato. Possibili cause:
            - ruolo diverso da `proprietario`
            - la struttura non appartiene al proprietario autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Accesso negato. Puoi modificare solo le tue strutture.
        '404':
          description: Struttura non trovata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Struttura non trovata
        '500':
          $ref: '#/components/responses/InternalServerError'


  /geocode:
      get:
        tags:
          - Routing
        summary: Traduce un indirizzo testuale in coordinate geografiche
        description: |
          Risolve una stringa di ricerca (indirizzo, luogo, punto di interesse) in
          una lista di coordinate candidate, tramite il servizio **Nominatim** di
          OpenStreetMap.

          ## Disambiguazione lato client
          Un indirizzo testuale è intrinsecamente ambiguo (es. "Via Roma" esiste in
          molte città). L'endpoint restituisce quindi un **array di candidati**
          ordinati per rilevanza: è il client a scegliere quale sia quello corretto.
          Se nessun candidato corrisponde, l'array è vuoto (`count: 0`) con stato `200`.

          ## Vincolo geografico
          I risultati sono limitati a una bounding box che circoscrive il
          Trentino-Alto Adige, coerente con l'area coperta dal motore di routing.
          Indirizzi fuori da tale area non vengono restituiti.

          ## Comportamento server-side
          - La query viene inoltrata a Nominatim con un `User-Agent` identificativo
            (requisito della usage policy del servizio).
          - Ogni risultato è normalizzato in `{ label, lng, lat }`, indipendente dal
            formato grezzo del provider.
          - L'operazione è di sola lettura, idempotente, senza side-effect.
        operationId: geocodeIndirizzo
        security:
          - bearerAuth: []
        parameters:
          - name: q
            in: query
            required: true
            description: |
              Stringa di ricerca dell'indirizzo o luogo. Minimo 3 caratteri
              (stringhe più corte producono `400`).
            schema:
              type: string
              minLength: 3
            example: Piazza Duomo Trento
        responses:
          '200':
            description: |
              Lista dei candidati corrispondenti alla ricerca. Può essere vuota se
              nessun luogo corrisponde alla query entro l'area consentita.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/GeocodeResponse'
                example:
                  count: 1
                  candidati:
                    - label: "Piazza del Duomo, Centro storico, Trento, Trentino-Alto Adige, Italia"
                      lng: 11.1214267
                      lat: 46.0673519
          '400':
            $ref: '#/components/responses/ValidationError'
          '401':
            $ref: '#/components/responses/Unauthorized'
          '502':
            description: |
              Il servizio di geocoding esterno (Nominatim) è irraggiungibile o ha
              risposto con un errore. Si tratta di un guasto del servizio a monte,
              non di un problema dell'input.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
                example:
                  error: Servizio di geocoding non disponibile
          '500':
            $ref: '#/components/responses/InternalServerError'

  /routes:
    get:
      tags:
        - Routing
      summary: Calcola un percorso pedonale verso una destinazione
      description: |
        Calcola il tragitto pedonale dalla posizione dell'utente a una
        destinazione, tramite il servizio di routing pubblico **OpenRouteService**
        con profilo `foot-walking`.

        ## Origine hardcoded (fase attuale)
        In questa fase di sviluppo l'origine è **fissata al centro di Trento**
        (`[11.1211, 46.0667]`) e non viene rilevata dalla geolocalizzazione reale.
        Il client NON fornisce l'origine. In una fase successiva l'origine sarà
        derivata dalla posizione del cittadino autenticato.

        ## Output
        La risposta contiene la geometria del percorso come **GeoJSON LineString**
        (array di coordinate `[lng, lat]`), pronta per il rendering su mappa, più
        distanza in metri e durata stimata in secondi.

        Quando il filtro profilo è attivo, la risposta include anche l'array
        `ostacoli_esclusi` con i punti che il sistema ha trasformato in aree di
        esclusione (`avoid_polygons`) inviate a OpenRouteService, utile al client
        per mostrare un indicatore visivo degli ostacoli bypassati sul tracciato.

        ## Natura stateless
        Il percorso NON viene persistito: è un dato derivato e deperibile, funzione
        dello stato corrente della rete. Ogni chiamata ricalcola il tragitto.
        L'operazione è idempotente e priva di side-effect.

        ## Filtro profilo disabilità (US11)
        Se l'utente autenticato è un `cittadino` con `profiloDisabilita` non vuoto,
        il sistema recupera automaticamente le segnalazioni attive incompatibili con
        il suo profilo nell'area del percorso e le converte in poligoni di
        esclusione (`avoid_polygons`) inviati a OpenRouteService, così da
        ricalcolare il tragitto evitando le aree attorno a quegli ostacoli.

        **Il profilo viene sempre letto dal JWT** non è un parametro client.
        Un cittadino non può simulare un profilo diverso dal proprio.

        **Definizione di «segnalazione attiva»:**
        - `stato ∈ {APERTA, IN_VERIFICA, PRESA_IN_CARICO}` escluse RISOLTA e ARCHIVIATA
        - Per le segnalazioni private: anche `visibile: true` (solo quelle validate dalla community)

        **Mapping categoria → profilo incompatibile:**

        | Categoria                  | Profili bloccati                               |
        |----------------------------|------------------------------------------------|
        | marciapiede_rotto          | sediaARotelle, ausilioDeambulazione            |
        | pavimentazione_dissestata  | sediaARotelle, ausilioDeambulazione            |
        | scalino_non_segnalato      | sediaARotelle, ausilioDeambulazione, cecita    |
        | mancanza_rampa (pubblica)  | sediaARotelle, ausilioDeambulazione            |
        | ostacolo_temporaneo        | sediaARotelle, cecita                          |
        | auto_sosta_vietata         | sediaARotelle, cecita                          |
        | semaforo_non_accessibile   | cecita                                         |
        | mancanza_rampa (privata)   | sediaARotelle, ausilioDeambulazione            |
        | ascensore_guasto           | sediaARotelle, ausilioDeambulazione            |
        | spazi_interni_stretti      | sediaARotelle                                  |
        | altro                      | (nessuno — troppo generico per bloccare)       |

        `sordita` non è bloccata da nessuna categoria: non genera barriere
        fisiche al transito pedonale.

        Se `profiloDisabilita` è `[]` o l'utente non è un `cittadino`, nessun
        filtro viene applicato e il comportamento è identico alla versione
        pre-US11 (nessun `avoid_polygons` passato a OpenRouteService).

        ## Distinzione degli errori
        - **`422`**: la destinazione è una coordinata valida ma **non raggiungibile
          a piedi** (punto isolato dalla rete pedonale, fuori dall'area coperta, o
          distanza oltre il limite pedonale). Non è un guasto: nessun percorso esiste.
        - **`502`**: il motore di routing è **irraggiungibile** (servizio spento o
          errore interno). Guasto reale del servizio a monte.
      operationId: calcolaPercorso
      security:
        - bearerAuth: []
      parameters:
        - name: to
          in: query
          required: true
          description: |
            Coordinate della destinazione nel formato `lng,lat` (due numeri
            separati da virgola, ordine GeoJSON: prima longitudine, poi latitudine).
            Range: longitudine ∈ [-180, 180], latitudine ∈ [-90, 90].
            Tipicamente ottenute da una precedente chiamata a `GET /geocode`.
          schema:
            type: string
          example: "11.1214267,46.0673519"
      responses:
        '200':
          description: |
            Percorso pedonale calcolato con successo.
            Se il filtro profilo è attivo, `ostacoli_esclusi` contiene i punti
            convertiti in aree di esclusione (`avoid_polygons`) inviate a
            OpenRouteService; altrimenti è un array vuoto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
              examples:
                senza_filtro:
                  summary: Utente senza profilo disabilità (nessun filtro)
                  value:
                    origin:
                      lng: 11.1211
                      lat: 46.0667
                    destination:
                      lng: 11.1214267
                      lat: 46.0673519
                    geometry:
                      type: LineString
                      coordinates:
                        - [11.121115, 46.066743]
                        - [11.121054, 46.066753]
                        - [11.121305, 46.0673]
                        - [11.121298, 46.067342]
                    distance: 79
                    duration: 56
                    ostacoli_esclusi: []
                con_filtro:
                  summary: Cittadino con sediaARotelle (2 ostacoli esclusi)
                  value:
                    origin:
                      lng: 11.1211
                      lat: 46.0667
                    destination:
                      lng: 11.1214267
                      lat: 46.0673519
                    geometry:
                      type: LineString
                      coordinates:
                        - [11.121115, 46.066743]
                        - [11.120890, 46.066910]
                        - [11.121298, 46.067342]
                    distance: 134
                    duration: 96
                    ostacoli_esclusi:
                      - segnalazioneId: 65b1a2c3d4e5f6a7b8c9d0e1
                        categoria: mancanza_rampa
                        tipo: pubblica
                        lng: 11.121054
                        lat: 46.066753
                      - segnalazioneId: 65b1a2c3d4e5f6a7b8c9d0e2
                        categoria: marciapiede_rotto
                        tipo: pubblica
                        lng: 11.121170
                        lat: 46.066820
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            Destinazione non raggiungibile a piedi. La coordinata è formalmente
            valida ma non esiste alcun percorso pedonale: punto isolato dalla rete
            stradale, fuori dall'area coperta dai dati cartografici, oppure tragitto
            oltre la distanza massima pedonale.

            **Nota:** può verificarsi anche quando il filtro profilo esclude così
            tanti archi da rendere irraggiungibile la destinazione. In questo caso
            il messaggio di errore lo segnala esplicitamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                destinazione_irraggiungibile:
                  value:
                    error: Nessun percorso pedonale raggiungibile verso la destinazione indicata
                irraggiungibile_per_filtro:
                  value:
                    error: >-
                      Nessun percorso disponibile compatibile con il profilo disabilità.
                      Prova a disabilitare il filtro o a scegliere una destinazione alternativa.
        '502':
          description: |
            Il servizio di routing (OpenRouteService) è irraggiungibile o ha restituito un
            errore non riconducibile all'input. Guasto del servizio a monte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Servizio di routing temporaneamente non disponibile
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/heatmap:
    get:
      tags:
        - Admin
      summary: Heatmap aggregata delle segnalazioni attive
      operationId: getHeatmap
      description: |
        Restituisce un'aggregazione spaziale delle segnalazioni **attive**
        (stati `APERTA` e `IN_VERIFICA`) raggruppate in celle di griglia
        geografica. Per ogni cella restituisce il **centroide**, il
        **conteggio** e la suddivisione per stato.

        Riservato agli operatori comunali (ruolo `operatore`).

        **Definizione di "attiva":** sono escluse le segnalazioni in stato
        `PRESA_IN_CARICO`, `RISOLTA` e `ARCHIVIATA`, che non rappresentano
        criticità ancora aperte sul territorio.

        **Distinzione APERTA / IN_VERIFICA:** le pubbliche sono sempre
        `APERTA`; le private nascono `IN_VERIFICA` e diventano `APERTA` solo
        dopo validazione crowd. La heatmap mantiene separati i due conteggi
        (`countAperta`, `countInVerifica`) così il client può pesarli o
        colorarli diversamente: una cella satura di sole `IN_VERIFICA` è meno
        affidabile di una satura di `APERTA`.

        **Aggregazione spaziale:** binning per arrotondamento delle coordinate
        secondo il parametro `precision` (numero di decimali). A 3 decimali la
        cella è circa 111 m di lato. Non è un geohash: è una griglia regolare
        lat/lng, scelta per semplicità e adeguatezza alla scala urbana.
      security:
        - bearerAuth: []
      parameters:
        - name: stato
          in: query
          required: false
          description: |
            Filtra per singolo stato attivo. Se omesso, include sia `APERTA`
            sia `IN_VERIFICA`. Valori non attivi vengono rifiutati con 400.
          schema:
            type: string
            enum: [APERTA, IN_VERIFICA]
        - name: from
          in: query
          required: false
          description: |
            Limite inferiore (incluso) sulla data di creazione (`createdAt`).
            Formato ISO 8601.
          schema:
            type: string
            format: date-time
          example: "2026-01-01T00:00:00.000Z"
        - name: to
          in: query
          required: false
          description: |
            Limite superiore (incluso) sulla data di creazione (`createdAt`).
            Formato ISO 8601. Deve essere >= from.
          schema:
            type: string
            format: date-time
          example: "2026-06-01T23:59:59.999Z"
        - name: precision
          in: query
          required: false
          description: |
            Numero di decimali per il binning delle coordinate (dimensione
            cella). Maggiore precisione = celle più piccole. Default 3 (~111 m).
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 3
      responses:
        '200':
          description: Aggregazione heatmap calcolata con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
              example:
                count: 2
                precision: 3
                celle:
                  - lat: 46.067
                    lng: 11.121
                    count: 7
                    countAperta: 5
                    countInVerifica: 2
                  - lat: 46.069
                    lng: 11.125
                    count: 3
                    countAperta: 0
                    countInVerifica: 3
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/reports:
    get:
      tags:
        - Admin
      summary: Dashboard segnalazioni pubbliche (lista filtrabile, ordinata e paginata)
      operationId: getReportsDashboard
      description: |
        Restituisce l'elenco **paginato** delle segnalazioni **pubbliche** per
        la dashboard operativa del Comune, pensata per la pianificazione della
        manutenzione (US20).

        Riservato agli operatori comunali (ruolo `operatore`).

        A differenza di `GET /publicReports` (lettura pubblica, non paginata),
        questo endpoint aggiunge **filtro temporale** (`from`/`to` su
        `createdAt`), **ordinamento** configurabile (`orderBy`/`order`) e
        **paginazione** (`page`/`limit`), funzioni necessarie a gestire
        volumi di dati elevati in un pannello operativo.

        **Scope dati:** vengono restituite esclusivamente le segnalazioni di
        tipo `pubblica`. Il filtro è forzato server-side e non è
        sovrascrivibile dal client.

        **Filtro stato:** se omesso, restituisce le segnalazioni in stati
        "lavorabili" dal punto di vista operativo, ovvero `APERTA` e
        `PRESA_IN_CARICO`. Lo stato `IN_VERIFICA` è escluso perché riservato
        alle private in validazione crowd (vincolo OCL: una pubblica non è mai
        `IN_VERIFICA`). Con l'introduzione della presa in carico (US21)
        l'operatore può filtrare distintamente le aperte da pianificare e
        quelle già in lavorazione.
      security:
        - bearerAuth: []
      parameters:
        - name: stato
          in: query
          required: false
          description: |
            Filtra per stato. Valori ammessi: `APERTA`, `PRESA_IN_CARICO`.
            Se omesso, include entrambi. Valori non ammessi → 400.
          schema:
            type: string
            enum: [APERTA, PRESA_IN_CARICO]
        - name: categoria
          in: query
          required: false
          description: Filtra per categoria di barriera. Valori non ammessi → 400.
          schema:
            $ref: '#/components/schemas/CategoriaBarrieraPubblica'
        - name: from
          in: query
          required: false
          description: |
            Limite inferiore (incluso) sulla data di creazione (`createdAt`).
            Formato ISO 8601.
          schema:
            type: string
            format: date-time
          example: "2026-01-01T00:00:00.000Z"
        - name: to
          in: query
          required: false
          description: |
            Limite superiore (incluso) sulla data di creazione (`createdAt`).
            Formato ISO 8601. Deve essere >= from.
          schema:
            type: string
            format: date-time
          example: "2026-06-01T23:59:59.999Z"
        - name: orderBy
          in: query
          required: false
          description: |
            Campo di ordinamento. Whitelist server-side: valori fuori lista → 400.
          schema:
            type: string
            enum: [createdAt, updatedAt, categoria, stato]
            default: createdAt
        - name: order
          in: query
          required: false
          description: Direzione dell'ordinamento.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          required: false
          description: Numero di pagina (1-based).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Numero di elementi per pagina.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista paginata di segnalazioni pubbliche.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReportsResponse'
              example:
                count: 2
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 42
                  totalPages: 3
                  hasPrev: false
                  hasNext: true
                segnalazioni:
                  - _id: 65b4f4e7b8d9c1f4a2e5b6d1
                    tipo: pubblica
                    descrizione: Marciapiede dissestato all'altezza del civico 12
                    categoria: marciapiede_rotto
                    stato: APERTA
                    geolocalizzazione:
                      type: Point
                      coordinates: [11.1217, 46.0700]
                    foto: []
                    autore: 65a3f4e7b8d9c1f4a2e5b6c7
                    enteCompetente: null
                    createdAt: '2026-05-15T09:20:00.000Z'
                    updatedAt: '2026-05-15T09:20:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/publicReports/{id}:
    patch:
      tags:
        - Admin
      summary: Prende in carico una segnalazione pubblica
      operationId: presaInCaricoReport
      description: |
        Formalizza l'inizio dei lavori di rimozione di una barriera segnalata
        su suolo pubblico (US21). L'operatore comunale "prende in carico" la
        segnalazione: lo stato transita da `APERTA` a `PRESA_IN_CARICO` e il
        campo `enteCompetente` viene valorizzato con l'`_id` dell'operatore
        autenticato (letto dal JWT, non dal client).

        Riservato agli operatori comunali (ruolo `operatore`).

        **Transizione di stato consentita:** unicamente `APERTA → PRESA_IN_CARICO`.
        Una segnalazione già `PRESA_IN_CARICO`, `RISOLTA` o `ARCHIVIATA` non è
        ri-prendibile in carico e produce `409 Conflict`: lo stato corrente
        della risorsa non permette la transizione.

        **Scope:** opera solo su segnalazioni di tipo `pubblica`. Un `id` che
        punta a una segnalazione privata produce `404` (fuori scope per questo
        endpoint amministrativo).

        **Assegnazione operatore:** `enteCompetente` è impostato server-side
        dall'identità del JWT. Il client non può assegnare la presa in carico a
        un operatore diverso da sé (anti-IDOR).

        **Semantica PATCH:** è una modifica parziale della risorsa esistente
        (cambia `stato` e `enteCompetente`). La non-idempotenza deriva dalla
        natura della transizione di dominio: la seconda chiamata fallisce
        perché lo stato non è più `APERTA`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della segnalazione pubblica da prendere in carico.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b4f4e7b8d9c1f4a2e5b6d1
      responses:
        '200':
          description: Segnalazione presa in carico con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresaInCaricoResponse'
              example:
                message: Segnalazione presa in carico con successo
                segnalazione:
                  _id: 65b4f4e7b8d9c1f4a2e5b6d1
                  tipo: pubblica
                  descrizione: Marciapiede dissestato all'altezza del civico 12
                  categoria: marciapiede_rotto
                  stato: PRESA_IN_CARICO
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0700]
                  foto: []
                  autore: 65a3f4e7b8d9c1f4a2e5b6c7
                  enteCompetente: 65a3f4e7b8d9c1f4a2e5b6c9
                  createdAt: '2026-05-15T09:20:00.000Z'
                  updatedAt: '2026-05-20T11:00:00.000Z'
        '400':
          description: |
            `id` non è un ObjectId valido (24 caratteri esadecimali).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: id
                    message: ObjectId non valido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Segnalazione pubblica non trovata. L'`id` non corrisponde ad alcuna
            segnalazione di tipo `pubblica` (inesistente o di tipo privato).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Segnalazione pubblica non trovata
        '409':
          description: |
            Conflitto di stato. La segnalazione esiste ma non è in stato
            `APERTA`, quindi non può essere presa in carico (es. già presa in
            carico, risolta o archiviata).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'La segnalazione non è in stato APERTA: impossibile prenderla in carico'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/privateReports/{id}:
    patch:
      tags:
        - Admin
      summary: Modifica lo stato di una segnalazione privata (override operatore)
      operationId: forzaStatoSegnalazionePrivata
      description: |
        Permette a un **operatore comunale** di modificare lo stato di una
        segnalazione **privata**, ignorando il normale processo di
        validazione crowdsourcing. Tutela i cittadini quando il
        proprietario della struttura ignora una segnalazione fondata che non
        raggiunge la soglia di validazione comunitaria.

        Riservato al ruolo `operatore`.

        **Bypass dei controlli ordinari:**
        - **Ownership:** l'operatore NON è proprietario della struttura. Il
          controllo di ownership applicato altrove (`struttura.proprietario ===
          JWT.userId`) viene volutamente saltato.
        - **Soglia crowd:** lo stato viene imposto a prescindere da
          `scoreAssociato` / `sogliaValidazione`.

        **Stati target ammessi (whitelist):** `APERTA`, `ARCHIVIATA`, `RISOLTA`.
        Valori fuori whitelist → `400`. Lo stato `IN_VERIFICA` non è un target
        valido: si modifica *fuori* dalla verifica, non dentro.

        Ogni chiamata incrementa
        `numForzature` sulla struttura. Modificare due volte allo stesso stato
        produce due incrementi (ogni intervento dell'operatore è un evento contato)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ObjectId della segnalazione privata da modificare.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{24}$'
          example: 65b1a2c3d4e5f6a7b8c9d0e1
      requestBody:
        required: true
        description: Stato target e motivazione obbligatoria dell'override.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForceStatusRequest'
            example:
              stato: APERTA
              motivazione: Segnalazione fondata ignorata dal proprietario, verificata da sopralluogo comunale
      responses:
        '200':
          description: Stato modificato con successo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceStatusResponse'
              example:
                message: Stato della segnalazione modificato con successo
                segnalazione:
                  _id: 65b1a2c3d4e5f6a7b8c9d0e1
                  tipo: privata
                  descrizione: Ingresso con gradino non segnalato, nessuna rampa
                  categoria: mancanza_rampa
                  stato: APERTA
                  geolocalizzazione:
                    type: Point
                    coordinates: [11.1217, 46.0667]
                  foto: []
                  autore: 65a3f4e7b8d9c1f4a2e5b6c7
                  strutturaAssociata: 65b4f4e7b8d9c1f4a2e5b6a9
                  scoreAssociato: 3
                  sogliaValidazione: 10
                  listaValidatori: []
                  numAnomalie: 0
                  sogliaAllarme: 5
                  visibile: true
                  motivazioneForzatura: Segnalazione fondata ignorata dal proprietario, verificata da sopralluogo comunale
                  createdAt: '2026-05-15T09:20:00.000Z'
                  updatedAt: '2026-05-20T11:00:00.000Z'
        '400':
          description: |
            Input non valido. Possibili cause:
            - `id` non è un ObjectId valido (24 hex)
            - `stato` mancante o fuori whitelist (`APERTA`, `ARCHIVIATA`, `RISOLTA`)
            - `motivazione` mancante o più corta di 10 caratteri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: Validazione fallita
                details:
                  - field: motivazione
                    message: la motivazione è obbligatoria (minimo 10 caratteri)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Segnalazione privata non trovata. L'`id` non corrisponde ad alcuna
            segnalazione di tipo `privata` (inesistente o di tipo pubblico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Segnalazione privata non trovata
        '500':
          $ref: '#/components/responses/InternalServerError'


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT ottenuto da `POST /auth/login` o `POST /auth/register/*`.
        Scadenza: 2 ore. Header atteso: `Authorization: Bearer <token>`.

  schemas:

    ValidationResult:
      type: object
      properties:
        message: { type: string }
        statoSegnalazione:
          type: string
          enum: [IN_VERIFICA, APERTA]
        scoreAssociato:
          type: number
          description: Score aggregato sulla segnalazione dopo il voto
        sogliaValidazione: { type: number }
        validata:
          type: boolean
          description: true se questo voto ha fatto scattare la validazione
        numValidatori:
          type: integer
          description: Numero validatori al momento della validazione (solo se validata=true)
        puntiPerValidatore:
          type: integer
          description: floor(10 / numValidatori) (solo se validata=true)
        scoreMancante:
          type: number
          description: Punti mancanti alla soglia (solo se validata=false)

    DisputeResult:
      type: object
      properties:
        message:
          type: string
          example: 'Smentita registrata: segnalazione archiviata'
        statoSegnalazione:
          type: string
          enum: [IN_VERIFICA, APERTA, ARCHIVIATA]
        scoreAssociato:
          type: number
          description: Score aggregato sulla segnalazione dopo la smentita
        sogliaValidazione:
          type: number
        archiviata:
          type: boolean
          description: true se questa smentita ha portato la segnalazione in ARCHIVIATA
        penalitaAutore:
          type: integer
          description: Punti effettivamente sottratti all'autore (0 se nessuna penalità)
          example: 3

    LoginRequest:
      type: object
      description: Payload per il login.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345

    LoginResponse:
      type: object
      description: Risposta login.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Login avvenuto con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token_login
        user:
          $ref: '#/components/schemas/UserPublic'

    RegisterCitizenRequest:
      type: object
      description: Payload registrazione cittadino.
      required:
        - email
        - password
        - nome
        - cognome
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi

    RegisterOwnerRequest:
      type: object
      description: Payload registrazione proprietario.
      required:
        - email
        - password
        - nome
        - cognome
        - partitaIVA
      properties:
        email:
          type: string
          format: email
          example: proprietario@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: SecurePassword12345
        nome:
          type: string
          example: Luigi
        cognome:
          type: string
          example: Bianchi
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'

    RegisterResponse:
      type: object
      description: Risposta registrazione.
      required:
        - message
        - token
        - user
      properties:
        message:
          type: string
          example: Registrazione avvenuta con successo
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example_token
        user:
          $ref: '#/components/schemas/UserPublic'

    UserPublic:
      type: object
      description: |
        Rappresentazione pubblica utente. Alcuni campi sono presenti solo
        per specifici ruoli (es. `profiloDisabilita`/`scoreAffidabilita` per cittadini,
        `partitaIVA` per proprietari).
      required:
        - _id
        - email
        - nome
        - cognome
        - ruolo
        - createdAt
      properties:
        _id:
          type: string
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        email:
          type: string
          format: email
          example: mario.rossi@example.com
        nome:
          type: string
          example: Mario
        cognome:
          type: string
          example: Rossi
        ruolo:
          type: string
          enum: [cittadino, proprietario, operatore]
          example: cittadino
        profiloDisabilita:
          type: array
          description: Presente solo per ruolo `cittadino`.
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle, cecita]
        scoreAffidabilita:
          type: number
          minimum: 1
          maximum: 14
          description: |
            Score di affidabilità del cittadino. Presente solo per ruolo `cittadino`.
            Range [1, 14], default 5 alla registrazione. Aumenta confermando
            segnalazioni poi validate; diminuisce se una propria segnalazione
            viene archiviata per smentita.
          example: 5
        partitaIVA:
          type: string
          pattern: '^\d{11}$'
        createdAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      description: |
        Payload per l'aggiornamento parziale del profilo (semantica PATCH).
        Tutti i campi sono opzionali, ma il body deve contenere almeno
        un campo modificabile presente nella whitelist.
      properties:
        nome:
          type: string
          description: Nuovo nome dell'utente. Modificabile da tutti i ruoli.
          example: Mario Pasquale
        cognome:
          type: string
          description: Nuovo cognome dell'utente. Modificabile da tutti i ruoli.
          example: Rossi
        profiloDisabilita:
          type: array
          description: |
            Array delle disabilità. Sovrascrive completamente il valore esistente.
            Riservato al ruolo `cittadino`.
          items:
            type: string
            enum: [sediaARotelle, cecita, sordita, ausilioDeambulazione]
          example: [sediaARotelle]

    GetProfileResponse:
      type: object
      required:
        - user
      description: |
        Risposta di `GET /users/me`. Contiene la rappresentazione pubblica
        dell'utente autenticato. I campi presenti dipendono dal ruolo.
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'

    UpdateProfileResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Profilo aggiornato con successo
        user:
          $ref: '#/components/schemas/UserPublic'
      
    DeleteAccountRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: |
            Password corrente dell'utente. Richiesta per re-autenticazione prima
            di un'operazione distruttiva e irreversibile.
          example: SecurePassword12345

    DeleteAccountResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Account eliminato con successo

    CategoriaBarrieraPubblica:
      type: string
      description: Categoria della barriera architettonica o ostacolo segnalato su suolo pubblico.
      enum:
        - marciapiede_rotto
        - ostacolo_temporaneo
        - auto_sosta_vietata
        - scalino_non_segnalato
        - pavimentazione_dissestata
        - mancanza_rampa
        - semaforo_non_accessibile
        - altro

    CategoriaBarrieraPrivata:
      type: string
      description: Categoria della barriera architettonica o ostacolo segnalato su suolo privato.
      enum:
        - mancanza_rampa
        - bagno_non_accessibile
        - ascensore_guasto
        - spazi_interni_stretti
        - altro

    StatoSegnalazione:
      type: string
      description: |
        Stato del ciclo di vita della segnalazione.
        Per `SegnalazionePubblica` lo stato `IN_VERIFICA` è proibito
        (vincolo OCL Deliverable 2, §3.3).
      enum:
        - APERTA
        - IN_VERIFICA
        - PRESA_IN_CARICO
        - RISOLTA
        - ARCHIVIATA

    GeoJSONPoint:
      type: object
      description: |
        Oggetto geografico in formato **GeoJSON Point** (RFC 7946).
        Usato per indicizzazione spaziale MongoDB tramite indice `2dsphere`.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
          example: Point
        coordinates:
          type: array
          description: |
            Array di 2 numeri nell'ordine `[longitudine, latitudine]`.
            Range: longitudine ∈ [-180, 180], latitudine ∈ [-90, 90].
          minItems: 2
          maxItems: 2
          items:
            type: number
          example: [11.1217, 46.0700]

    SegnalazioneBase:
      type: object
      description: |
        Schema base condiviso tra `SegnalazionePubblica` e `SegnalazionePrivata`.
        Corrisponde al modello Mongoose con `discriminatorKey: 'tipo'`.
      properties:
        _id:
          type: string
          pattern: '^[a-f0-9]{24}$'
          example: 65b4f4e7b8d9c1f4a2e5b6d1
        tipo:
          type: string
          enum: [pubblica, privata]
          description: Discriminator key.
        descrizione:
          type: string
          minLength: 10
          maxLength: 1000
        categoria:
          $ref: '#/components/schemas/CategoriaBarrieraPubblica'
        stato:
          $ref: '#/components/schemas/StatoSegnalazione'
        geolocalizzazione:
          $ref: '#/components/schemas/GeoJSONPoint'
        foto:
          type: array
          description: |
            Array di URL relativi delle foto caricate. Formato filename:
            `{timestamp}-{nome_originale_sanitizzato}.{ext}`.
          maxItems: 5
          items:
            type: string
            example: /uploads/reports/1747320000000-foto_marciapiede.jpg
        autore:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId del cittadino che ha creato la segnalazione.
          example: 65a3f4e7b8d9c1f4a2e5b6c7
        bloccaModifica:
          type: boolean
          description: |
            Se `true`, la segnalazione è in stato terminale e non
            modificabile (es. RISOLTA, ARCHIVIATA).
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-05-15T09:20:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-15T09:20:00.000Z'

    SegnalazionePubblica:
      description: |
        Rappresentazione completa di una segnalazione su suolo pubblico
        (discriminator `tipo = "pubblica"`).
      allOf:
        - $ref: '#/components/schemas/SegnalazioneBase'
        - type: object
          properties:
            tipo:
              type: string
              enum: [pubblica]
            enteCompetente:
              type: string
              nullable: true
              pattern: '^[a-f0-9]{24}$'
              description: |
                ObjectId dell'operatore comunale assegnato. `null` finché non
                avviene l'assegnazione.
              example: null

    SegnalazionePrivata:
      description: |
        Rappresentazione di una segnalazione su struttura privata
        (discriminator `tipo = "privata"`).
      allOf:
        - $ref: '#/components/schemas/SegnalazioneBase'
        - type: object
          properties:
            tipo:
              type: string
              enum: [privata]
            strutturaAssociata:
              type: string
              pattern: '^[a-f0-9]{24}$'
              description: ObjectId della `StrutturaPrivata` associata.
              example: 65b4f4e7b8d9c1f4a2e5b6a9
            scoreAssociato:
              type: number
              description: |
                Punteggio di validazione crowdsourcing. Inizializzato a
                `1 + scoreAffidabilita dell'autore` alla creazione. Le conferme
                lo aumentano (del peso del votante), le smentite lo diminuiscono.
                Può diventare negativo a seguito di una smentita: quando scende
                a 0 o meno la segnalazione passa in `ARCHIVIATA`.
              example: 6
            sogliaValidazione:
              type: number
              description: Soglia di score per rendere visibile la segnalazione.
              example: 10
            listaValidatori:
              type: array
              description: Array di ObjectId dei cittadini che hanno supportato la segnalazione (evita voti doppi).
              items:
                type: string
                pattern: '^[a-f0-9]{24}$'
              example: []
            numAnomalie:
              type: integer
              minimum: 0
              description: Contatore di comportamenti anomali rilevati.
              example: 0
            sogliaAllarme:
              type: integer
              description: Soglia di anomalie oltre la quale viene generato un allarme al comune.
              example: 5
            visibile:
              type: boolean
              description: |
                Indica se la segnalazione appare sulla mappa. È `true` per gli stati
                non terminali (`IN_VERIFICA`, `APERTA`) e `false` per quelli terminali
                (`RISOLTA`, `ARCHIVIATA`). Campo ormai derivabile da `stato`, mantenuto
                per retro-compatibilità.
              example: true
            penalitaApplicata:
              type: boolean
              description: |
                `true` quando la penalità all'autore (ingresso in `ARCHIVIATA` da
                smentita) è già stata applicata. Garantisce che la penalità scatti
                una sola volta nel ciclo di vita della segnalazione.
              default: false
              example: false
            motivazioneForzatura:
              type: string
              nullable: true
              maxLength: 500
              description: |
                Motivazione dell'ultima modifica di stato forzata da un
                operatore. null se la segnalazione non è mai stata
                forzata.
              example: null

    CreateSegnalazionePrivataResponse:
      type: object
      properties:
        message:
          type: string
          example: Segnalazione privata creata con successo ed in attesa di validazione
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePrivata'

    StrutturaPrivata:
      type: object
      description:  |
        Rappresentazione di una struttura privata registrata da un proprietario.
        Le strutture sono il "target" delle segnalazioni private.
      properties:
        _id:
          type: string
          example: 65b4f4e7b8d9c1f4a2e5b6a9
        nome:
          type: string
          minLength: 2
          maxLength: 100
          example: Bar Centrale
        categoria:
          type: string
          enum:
            - ristorante
            - bar
            - negozio
            - ufficio
            - hotel
            - studio_medico
            - palestra
            - altro
          example: bar
        indirizzo:
          type: string
          minLength: 5
          maxLength: 200
          example: Via Roma 12, Trento
        geolocalizzazione:
          $ref: '#/components/schemas/GeoJSONPoint'
        proprietario:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId del proprietario che ha registrato la struttura.
          example: 65a3f4e7b8d9c1f4a2e5b6c8
        numForzature:
          type: integer
          minimum: 0
          default: 0
          description: Numero di segnalazioni della struttura modificate forzatamente da un
            operatore comunale perché ignorate dal proprietario. 
          example: 0
        createdAt:
          type: string
          format: date-time
          example: '2026-05-14T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-14T10:00:00.000Z'

    CreateStrutturaRequest:
      type: object
      description: Payload JSON per la registrazione di una struttura privata.
      required:
        - nome
        - categoria
        - indirizzo
        - geolocalizzazione
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 100
          example: Bar Centrale
        categoria:
          type: string
          enum:
            - ristorante
            - bar
            - negozio
            - ufficio
            - hotel
            - studio_medico
            - palestra
            - altro
          example: bar
        indirizzo:
            type: string
            minLength: 5
            maxLength: 200
            example: Via Belenzani 14, 38122 Trento TN
        geolocalizzazione:
            $ref: '#/components/schemas/GeoJSONPoint'
    
    CreateStrutturaResponse:
      type: object
      required:
        - message
        - struttura
      properties:
        message:
          type: string
          example: Struttura registrata con successo
        struttura:
          $ref: '#/components/schemas/StrutturaPrivata'

    StruttureListResponse:
      type: object
      required:
        - count
        - strutture
      properties:
        count:
          type: integer
          description: Numero di strutture nell'array (può essere 0).
        strutture:
          type: array
          items:
            $ref: '#/components/schemas/StrutturaPrivata'

    GeocodeCandidate:
      type: object
      description: Singolo candidato risultante da una ricerca di geocoding.
      required:
        - label
        - lng
        - lat
      properties:
        label:
          type: string
          description: Etichetta human-readable completa del luogo (display_name di Nominatim).
          example: "Piazza del Duomo, Centro storico, Trento, Trentino-Alto Adige, Italia"
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitudine.
          example: 11.1214267
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitudine.
          example: 46.0673519

    GeocodeResponse:
      type: object
      description: Risposta della ricerca di geocoding. L'array può essere vuoto.
      required:
        - count
        - candidati
      properties:
        count:
          type: integer
          minimum: 0
          description: Numero di candidati restituiti (può essere 0).
          example: 1
        candidati:
          type: array
          items:
            $ref: '#/components/schemas/GeocodeCandidate'

    Coordinate:
      type: object
      description: Coppia di coordinate geografiche.
      required:
        - lng
        - lat
      properties:
        lng:
          type: number
          format: double
          example: 11.1211
        lat:
          type: number
          format: double
          example: 46.0667

    RouteGeometry:
      type: object
      description: |
        Geometria del percorso in formato GeoJSON LineString. Ogni elemento
        di `coordinates` è una coppia `[longitudine, latitudine]`.
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [LineString]
          example: LineString
        coordinates:
          type: array
          description: Sequenza ordinata di vertici del percorso, ordine `[lng, lat]`.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          example:
            - [11.121115, 46.066743]
            - [11.121305, 46.0673]
    
    OstacoloEscluso:
      type: object
      description: |
        Rappresentazione di una segnalazione attiva esclusa dal percorso
        perché incompatibile con il profilo disabilità del cittadino.
        Corrisponde a un punto attorno al quale viene costruita un'area di
        esclusione (`avoid_polygons`) inviata a OpenRouteService.
      required:
        - segnalazioneId
        - categoria
        - tipo
        - lng
        - lat
      properties:
        segnalazioneId:
          type: string
          pattern: '^[a-f0-9]{24}$'
          description: ObjectId M

    RouteResponse:
      type: object
      description: Percorso pedonale calcolato tra origine e destinazione.
      required:
        - origin
        - destination
        - geometry
        - distance
        - duration
      properties:
        origin:
          $ref: '#/components/schemas/Coordinate'
        destination:
          $ref: '#/components/schemas/Coordinate'
        geometry:
          $ref: '#/components/schemas/RouteGeometry'
        distance:
          type: integer
          minimum: 0
          description: Lunghezza totale del percorso in metri.
          example: 79
        duration:
          type: integer
          minimum: 0
          description: Durata stimata del percorso a piedi, in secondi.
          example: 56

    HeatmapCella:
      type: object
      description: |
        Singola cella della griglia. `lat`/`lng` sono il centroide della cella
        (coordinate arrotondate alla precisione richiesta).
      required:
        - lat
        - lng
        - count
        - countAperta
        - countInVerifica
      properties:
        lat:
          type: number
          format: double
          description: Latitudine del centroide della cella.
          example: 46.067
        lng:
          type: number
          format: double
          description: Longitudine del centroide della cella.
          example: 11.121
        count:
          type: integer
          minimum: 1
          description: Conteggio totale segnalazioni attive nella cella.
          example: 7
        countAperta:
          type: integer
          minimum: 0
          description: Quante delle segnalazioni della cella sono in stato APERTA.
          example: 5
        countInVerifica:
          type: integer
          minimum: 0
          description: Quante delle segnalazioni della cella sono in stato IN_VERIFICA.
          example: 2

    HeatmapResponse:
      type: object
      required:
        - count
        - precision
        - celle
      properties:
        count:
          type: integer
          minimum: 0
          description: Numero di celle restituite (può essere 0).
        precision:
          type: integer
          description: Precisione di binning effettivamente applicata.
          example: 3
        celle:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapCella'

    PaginationMeta:
      type: object
      description: Metadati di paginazione per le liste paginate.
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasPrev
        - hasNext
      properties:
        page:
          type: integer
          minimum: 1
          description: Pagina corrente (1-based).
          example: 1
        limit:
          type: integer
          minimum: 1
          description: Numero di elementi per pagina richiesto.
          example: 20
        totalItems:
          type: integer
          minimum: 0
          description: Numero totale di documenti che soddisfano il filtro.
          example: 42
        totalPages:
          type: integer
          minimum: 0
          description: Numero totale di pagine disponibili.
          example: 3
        hasPrev:
          type: boolean
          description: True se esiste una pagina precedente.
          example: false
        hasNext:
          type: boolean
          description: True se esiste una pagina successiva.
          example: true

    PaginatedReportsResponse:
      type: object
      description: Risposta paginata di `GET /admin/reports`.
      required:
        - count
        - pagination
        - segnalazioni
      properties:
        count:
          type: integer
          minimum: 0
          description: Numero di elementi nella pagina corrente (<= limit).
          example: 20
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        segnalazioni:
          type: array
          items:
            $ref: '#/components/schemas/SegnalazionePubblica'

    PresaInCaricoResponse:
      type: object
      description: Risposta di `PATCH /admin/reports/{id}/presa-in-carico`.
      required:
        - message
        - segnalazione
      properties:
        message:
          type: string
          example: Segnalazione presa in carico con successo
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePubblica'

    Accessibility:
      type: object
      description: |
        Sottodocumento di autocertificazione dell'accessibilità di una
        struttura. Ogni parametro è un booleano con default `false`.
        Compilato dal proprietario (US15).
      properties:
        rampa:
          type: boolean
          description: Presenza di rampa di accesso per superare dislivelli all'ingresso.
          default: false
          example: true
        ascensore:
          type: boolean
          description: Presenza di ascensore utilizzabile per raggiungere i piani.
          default: false
          example: false
        bagnoAccessibile:
          type: boolean
          description: Presenza di servizio igienico accessibile a persone con disabilità.
          default: false
          example: true
        ingressoSenzaGradini:
          type: boolean
          description: Ingresso a raso, privo di gradini.
          default: false
          example: true
        parcheggioRiservato:
          type: boolean
          description: Presenza di posto auto riservato a persone con disabilità.
          default: false
          example: false
 
    UpdateAccessibilityRequest:
      type: object
      description: |
        Payload PATCH parziale per l'autocertificazione. Tutti i campi sono
        opzionali ma almeno uno deve essere presente. Il campo derivato
        `accessibile` NON è accettato (verrebbe ignorato): è calcolato
        esclusivamente server-side.
      minProperties: 1
      properties:
        rampa:
          type: boolean
          example: true
        ascensore:
          type: boolean
          example: false
        bagnoAccessibile:
          type: boolean
          example: true
        ingressoSenzaGradini:
          type: boolean
          example: true
        parcheggioRiservato:
          type: boolean
          example: false
 
    GetStrutturaResponse:
      type: object
      required:
        - struttura
      description: Risposta di `GET /structures/{id}`.
      properties:
        struttura:
          $ref: '#/components/schemas/StrutturaPrivata'
 
    UpdateStrutturaResponse:
      type: object
      required:
        - message
        - struttura
      description: Risposta di `PATCH /structures/{id}/accessibility`.
      properties:
        message:
          type: string
          example: Accessibilità aggiornata con successo
        struttura:
          $ref: '#/components/schemas/StrutturaPrivata'

    ForceStatusRequest:
      type: object
      description: |
        Payload per la modifica di stato da parte dell'operatore (US23).
        Entrambi i campi obbligatori.
      required:
        - stato
        - motivazione
      properties:
        stato:
          type: string
          description: |
            Stato target da imporre. Whitelist ristretta agli stati verso cui
            ha senso modificare fuori dalla verifica crowd.
          enum: [APERTA, ARCHIVIATA, RISOLTA]
          example: APERTA
        motivazione:
          type: string
          minLength: 10
          maxLength: 500
          description: |
            Giustificazione obbligatoria dell'override. Persistita come audit
            trail per garantire tracciabilità dell'intervento amministrativo.
          example: Segnalazione fondata ignorata dal proprietario, verificata da sopralluogo comunale

    ForceStatusResponse:
      type: object
      required:
        - message
        - segnalazione
      properties:
        message:
          type: string
          example: Stato della segnalazione modificato con successo
        segnalazione:
          $ref: '#/components/schemas/SegnalazionePrivata'


    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Messaggio di errore human-readable.
          example: Errore interno del server

    ValidationError:
      type: object
      required:
        - error
        - details
      properties:
        error:
          type: string
          example: Validazione fallita
        details:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Nome del campo che ha fallito la validazione.
                example: categoria
              message:
                type: string
                description: Messaggio di errore specifico del campo.
                example: 'categoria "marciapide" non ammessa'
  
  responses:
    ValidationError:
      description: |
        Dati di input non validi. Il body contiene la lista dei campi che hanno fallito la validazione.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            error: Validazione fallita
            details:
              - field: email
                message: Formato email non valido

    Unauthorized:
      description: |
        Autenticazione mancante o non valida. Possibili cause:
        - header `Authorization: Bearer <token>` (o `x-access-token`) assente
        - token JWT malformato
        - token JWT scaduto
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tokenMancante:
              value:
                error: Token mancante
            tokenScaduto:
              value:
                error: Token scaduto
            tokenNonValido:
              value:
                error: Token non valido

    Forbidden:
      description: |
        Autenticazione valida ma il ruolo dell'utente non è autorizzato per l'operazione.
        Esempi: un proprietario tenta di creare una segnalazione (operazione riservata ai cittadini),
        un cittadino tenta di moderare segnalazioni in verifica (operazione riservata agli operatori).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Accesso negato: ruolo non autorizzato'

    InternalServerError:
      description: Errore interno del server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Errore interno del server